name: Sync gift rows to keyword sheet

on:
  push:
    branches: [main]
    paths:
      - "gifts/**/row.json"

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Find changed row.json files and send them
        env:
          WRITER_SECRET: ${{ secrets.WRITER_SECRET }}
          ENDPOINT: https://script.google.com/macros/s/AKfycbyJdMWpD2DXmWMvhbDLzMaBWisp1hMVc8hVB4k7WWcNlZwljbv9yRaAP2lbUr2CVErnpQ/exec
        run: |
          set -e
          # 直前のコミットで追加/変更された row.json だけを対象にする
          FILES=$(git diff --name-only HEAD~1 HEAD -- 'gifts/**/row.json' || true)
          if [ -z "$FILES" ]; then
            echo "対象のrow.jsonが見つかりませんでした"
            exit 0
          fi
          for f in $FILES; do
            if [ ! -f "$f" ]; then
              echo "skip (deleted): $f"
              continue
            fi
            echo "送信中: $f"
            PAYLOAD=$(jq --arg secret "$WRITER_SECRET" '. + {secret: $secret, action: "append"}' "$f")
            RESPONSE=$(curl -sS -L -w "\n[HTTP_STATUS:%{http_code}]" -X POST \
              -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0 Safari/537.36" \
              -H "Content-Type: text/plain;charset=utf-8" \
              -d "$PAYLOAD" \
              "$ENDPOINT")
            echo "$RESPONSE"
            if ! echo "$RESPONSE" | grep -q '"ok":true'; then
              echo "::error::$f の書き込みに失敗した可能性があります"
              exit 1
            fi
          done
