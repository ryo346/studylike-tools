name: Sync gift rows to keyword sheet

on:
  push:
    branches: [main]
    paths:
      - "gifts/**/row.json"

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Find changed row.json files and send them
        env:
          WRITER_SECRET: ${{ secrets.WRITER_SECRET }}
          ENDPOINT: https://script.google.com/macros/s/AKfycbyJdMWpD2DXmWMvhbDLzMaBWisp1hMVc8hVB4k7WWcNlZwljbv9yRaAP2lbUr2CVErnpQ/exec
        run: |
          set -e
          FILES=$(git diff --name-only HEAD~1 HEAD -- 'gifts/**/row.json' || true)
          if [ -z "$FILES" ]; then
            echo "対象のrow.jsonが見つかりませんでした"
            exit 0
          fi
          for f in $FILES; do
            if [ ! -f "$f" ]; then
              echo "skip (deleted): $f"
              continue
            fi
            echo "送信中: $f"
            node -e "
              const fs = require('fs');
              const body = JSON.parse(fs.readFileSync(process.argv[1], 'utf8'));
              body.secret = process.env.WRITER_SECRET;
              body.action = 'append';
              fetch(process.env.ENDPOINT, {
                method: 'POST',
                headers: {'Content-Type': 'text/plain;charset=utf-8'},
                body: JSON.stringify(body)
              }).then(async (res) => {
                const text = await res.text();
                console.log('status:', res.status);
                console.log('body:', text);
                if (!text.includes('\"ok\":true')) {
                  console.error('書き込みに失敗した可能性があります');
                  process.exit(1);
                }
              }).catch((err) => {
                console.error('fetch error:', err);
                process.exit(1);
              });
            " "$f"
          done
