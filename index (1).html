<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>2学期リスタート設計｜STUDYLIKE塾</title>
<style>
:root{
  --pine:#12231D;
  --paper:#FBFAF6;
  --mint:#2FA184;
  --mint-soft:#E4F0EB;
  --sun:#F0B93F;
  --clay:#D85F42;
  --line:#DCE4DF;
  --muted:#5F6F68;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{
  background:var(--paper);
  color:var(--pine);
  font-family:"Hiragino Kaku Gothic ProN","Hiragino Sans","Noto Sans JP","Yu Gothic",sans-serif;
  font-size:16px;
  line-height:1.75;
  font-feature-settings:"palt" 1;
  padding:0 0 72px;
}
.wrap{max-width:560px;margin:0 auto;padding:0 20px}

/* ---------- hero ---------- */
.hero{padding:52px 0 36px}
.hero .kicker{font-size:13px;color:var(--mint);font-weight:700;letter-spacing:.06em;margin-bottom:14px}
.hero h1{
  font-size:31px;line-height:1.42;font-weight:900;letter-spacing:-.01em;
}
.hero h1 .under{
  background:linear-gradient(transparent 62%, #FBE4A8 62%);
}
.hero p{margin-top:18px;color:var(--muted);font-size:15px}
.counter{
  margin-top:26px;padding:16px 18px;border:1.5px solid var(--pine);border-radius:2px;
  display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;
}
.counter b{font-size:34px;font-weight:900;line-height:1;letter-spacing:-.02em}
.counter span{font-size:13px;color:var(--muted)}
.spec{margin-top:22px;font-size:13.5px;color:var(--muted);line-height:2}
.spec i{font-style:normal;color:var(--mint);font-weight:800;margin-right:6px}

/* ---------- buttons ---------- */
button{font-family:inherit;font-size:inherit;cursor:pointer}
.btn{
  display:block;width:100%;padding:17px;border:none;border-radius:2px;
  background:var(--pine);color:#fff;font-weight:800;font-size:16.5px;letter-spacing:.02em;
  transition:opacity .15s;
}
.btn:hover{opacity:.86}
.btn:disabled{background:#C6CFC9;color:#fff;cursor:not-allowed}
.btn.ghost{background:none;color:var(--muted);border:1.5px solid var(--line);font-weight:700;font-size:14.5px;padding:13px}
.btn:focus-visible,.opt:focus-visible{outline:3px solid var(--sun);outline-offset:2px}

/* ---------- progress ---------- */
.prog{position:sticky;top:0;background:var(--paper);padding:16px 0 12px;z-index:5}
.prog .bar{height:3px;background:var(--line);border-radius:2px;overflow:hidden}
.prog .bar>i{display:block;height:100%;background:var(--mint);transition:width .35s cubic-bezier(.4,0,.2,1)}
.prog .lab{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-bottom:8px;font-weight:700}

/* ---------- question ---------- */
.step h2{font-size:20px;font-weight:900;margin:30px 0 4px;letter-spacing:-.01em}
.step .sub{font-size:13.5px;color:var(--muted);margin-bottom:22px}
.q{margin-bottom:30px}
.q .qt{font-size:16px;font-weight:800;margin-bottom:4px}
.q .qn{font-size:13px;color:var(--muted);margin-bottom:11px}
.opts{display:flex;flex-direction:column;gap:8px}
.opts.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.opt{
  width:100%;text-align:left;padding:13px 15px;border:1.5px solid var(--line);
  background:#fff;border-radius:2px;font-size:14.5px;font-weight:600;color:var(--pine);
  line-height:1.5;transition:border-color .12s,background .12s;
}
.opt:hover{border-color:var(--mint)}
.opt[aria-pressed="true"]{border-color:var(--pine);background:var(--pine);color:#fff}
.opt small{display:block;font-size:12px;font-weight:500;opacity:.7;margin-top:2px}
.tin{
  width:100%;padding:14px 15px;border:1.5px solid var(--line);background:#fff;
  border-radius:2px;font-family:inherit;font-size:16px;font-weight:600;color:var(--pine);
}
.tin:focus{outline:none;border-color:var(--pine)}
.tin::placeholder{color:#A9B5AF;font-weight:500}
.nav{display:flex;gap:10px;margin-top:34px}
.nav .btn{flex:1}
.nav .btn.ghost{flex:0 0 92px}

/* ---------- result ---------- */
.rhead{padding:38px 0 6px}
.rhead .tag{display:inline-block;background:var(--sun);color:var(--pine);font-size:12px;font-weight:900;padding:4px 10px;border-radius:2px;margin-bottom:14px}
.rhead h2{font-size:27px;font-weight:900;line-height:1.4;letter-spacing:-.01em}
.rhead .lead{margin-top:14px;font-size:15px;color:var(--muted)}

.sect{margin-top:44px}
.sect>h3{
  font-size:15px;font-weight:900;padding-bottom:9px;border-bottom:2px solid var(--pine);
  display:flex;justify-content:space-between;align-items:baseline;
}
.sect>h3 em{font-style:normal;font-size:12px;font-weight:700;color:var(--muted)}

.fix{background:var(--mint-soft);border-radius:2px;padding:18px;margin-top:16px}
.fix .t{font-weight:900;font-size:15px;margin-bottom:7px}
.fix p{font-size:14.5px}
.fix ul{margin:12px 0 0 0;padding-left:18px}
.fix li{font-size:14px;margin-bottom:5px}

.stat{display:flex;gap:0;margin-top:16px;border:1.5px solid var(--line);border-radius:2px;overflow:hidden}
.stat>div{flex:1;padding:14px 12px;text-align:center;border-right:1px solid var(--line)}
.stat>div:last-child{border-right:none}
.stat b{display:block;font-size:24px;font-weight:900;line-height:1.2;letter-spacing:-.02em}
.stat span{font-size:11.5px;color:var(--muted);font-weight:700}

.subj{margin-top:20px;border-left:3px solid var(--mint);padding-left:15px}
.subj.sub-m{border-color:var(--sun)}
.subj.sub-j{border-color:var(--clay)}
.subj.sub-x{border-color:#9AA8A2}
.subj .sh{display:flex;align-items:baseline;gap:9px;margin-bottom:11px}
.subj .sh b{font-size:17px;font-weight:900}
.subj .sh span{font-size:12px;color:var(--muted);font-weight:700}
.book{padding:12px 0;border-bottom:1px dashed var(--line)}
.book:last-child{border-bottom:none}
.book .bn{font-weight:800;font-size:15px;line-height:1.5}
.book .bm{font-size:12px;color:var(--muted);margin-top:2px}
.book .bg{font-size:14px;margin-top:7px;background:#fff;border:1px solid var(--line);padding:9px 11px;border-radius:2px}
.book .bg b{color:var(--clay);font-weight:900}
.note{font-size:13.5px;color:var(--muted);margin-top:10px;line-height:1.8}

table{width:100%;border-collapse:collapse;margin-top:14px;font-size:13.5px}
th,td{border:1px solid var(--line);padding:9px 10px;text-align:left;vertical-align:top}
th{background:var(--mint-soft);font-weight:800;font-size:12.5px;white-space:nowrap}
td b{font-weight:800}
.tw{overflow-x:auto;-webkit-overflow-scrolling:touch}

.warn{margin-top:16px;border:1.5px solid var(--clay);border-radius:2px;padding:15px}
.warn .t{font-weight:900;color:var(--clay);font-size:14px;margin-bottom:6px}
.warn p{font-size:14px}

.cta{margin-top:52px;background:var(--pine);color:#fff;border-radius:2px;padding:28px 22px}
.cta .limit{display:inline-block;border:1.5px solid var(--sun);color:var(--sun);font-size:12px;font-weight:900;padding:3px 9px;border-radius:2px;margin-bottom:14px}
.cta h3{font-size:21px;font-weight:900;line-height:1.45;margin-bottom:14px}
.cta p{font-size:14.5px;color:#C9D6D0;line-height:1.85}
.cta ul{margin:18px 0;padding:0;list-style:none}
.cta li{font-size:14.5px;padding:9px 0 9px 26px;position:relative;border-bottom:1px solid #2C3D36;color:#EAF1EE}
.cta li:before{content:"";position:absolute;left:2px;top:17px;width:11px;height:11px;background:var(--sun)}
.cta .how{background:#1D3129;border-radius:2px;padding:15px;margin-top:18px;font-size:14px;color:#EAF1EE;line-height:1.9}
.cta .how b{color:var(--sun)}
.foot{margin-top:34px;font-size:12.5px;color:var(--muted);line-height:1.9;text-align:center}
.foot a{color:var(--mint)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
@media(max-width:400px){.hero h1{font-size:27px}.rhead h2{font-size:23px}}
</style>
</head>

function el(h){var d=document.createElement("div");d.innerHTML=h.trim();return d.firstChild;}
function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}

function daysToTest(){
  var t = new Date(2027,0,16); /* 2027年1月16日(土) 共通テスト初日 */
  var d = Math.ceil((t - new Date())/86400000);
  return d > 0 ? d : 0;
}

/* ============================================================

function render(){
  var app = document.getElementById("app");

  if(page === -1) return app.appendChild(viewIntro());
  if(page === 99) return app.appendChild(viewResult());
  app.appendChild(viewStep(page));
}

/* --- 到達ステージ --- */
function stage(hen, grade){
  var s = (hen==="a"||hen==="b") ? "basic" : (hen==="c" ? "standard" : "advanced");
  if(grade==="h1" && s==="advanced") s = "standard";   /* 高1は先取りより土台 */
  return s;
}

/* --- 月間の可処分時間 --- */
function monthHours(){
  var wd = {a:0.5,b:1.5,c:2.5,d:3.5,e:4.5}[S.wd];
  var hd = {a:2,b:4,c:7,d:9.5}[S.hd];
  var cd = {c5:5,c34:3.5,c12:1.5,c0:0}[S.club];
  var clubDays = Math.min(22, Math.round(cd*4));
  var offDays  = 22 - clubDays;
  var weekday  = clubDays*(wd*0.6) + offDays*wd;
  return {
    total: Math.round(weekday + hd*8),
    wd: wd, hd: hd, clubDays: clubDays,
    wdClub: Math.round(wd*0.6*10)/10
  };
}

/* --- 科目配分 --- */
function ratios(){
  var g=S.grade, c=S.course;
  if(g==="h1") return {e:.45,m:.35,j:.20,x:0};
  if(g==="h2") return c==="ri" ? {e:.35,m:.40,j:.15,x:.10} : {e:.40,m:.25,j:.25,x:.10};
  return c==="ri" ? {e:.30,m:.35,j:.15,x:.20} : {e:.35,m:.20,j:.25,x:.20};
}

/* --- 進捗表現 --- */
function goalText(hours, book, tag){
  var h = book.h;
  var pct = Math.round(hours / h * 100);
  var min = Math.max(5, Math.round(hours/30*60/5)*5);  /* 1日あたりの分。5分刻み */
  var d = "1日 <b>"+min+"分</b>";
  if(pct >= 200) return {p:pct, m:min, t:d+"　→　1ヶ月で <b>2周</b>。2周目は×印だけ回す"};
  if(pct >= 100) return {p:pct, m:min, t:d+"　→　1ヶ月で <b>1冊終わる</b>"};
  if(pct >= 55)  return {p:pct, m:min, t:d+"　→　1ヶ月で <b>約"+Math.round(pct/10)*10+"%</b>。残りは来月に回す"};
  if(pct >= 25)  return {p:pct, m:min, t:d+"　→　1ヶ月で <b>約"+Math.round(pct/10)*10+"%</b>。後ろは切って前半だけ完璧にする"};
  var narrow = /単語|熟語/.test(tag||"")
    ? "<b>番号を区切って</b>、その範囲だけを完璧にする"
    : "<b>範囲を1単元に絞って</b>、そこだけ完璧にする";
  return {p:pct, m:min, t:d+"　→　1周は狙わない。"+narrow};
}

/* --- 英語プラン --- */
function planEng(hours){
  var g=S.grade, st=stage(S.he,g), out=[], w=[];
  /* 単語 */
  var owned = {t1900:B.t1900,sys:B.sys,t1400:B.t1400,sysB:B.sysB,duo:B.duo,tetsu:B.tetsu}[S.bw];
  if(owned){ out.push({b:owned,tag:"単語(継続)",note:"買い替えない。夏に半端になった範囲を頭からもう1周する。"}); }
  else if(S.bw==="other"){ out.push({b:{n:"学校配布の単語帳",p:"—",lv:"—",h:30},tag:"単語(継続)",note:"学校配布のもので十分。1冊を最後まで使い切る。"}); }
  else { out.push({b: st==="basic"&&S.he==="a" ? B.t1400 : B.t1900, tag:"単語(新規)", note:"大学受験の王道の1冊目。ここを2学期のベースにする。"}); }
  w.push(.30);
  /* 文法 */
  var og = {next:B.next,vin:B.next,pola1:B.pola1,ooiwa:B.ooiwa}[S.bg];
  if(S.bg==="vin") og = {n:"Vintage / Scramble",p:"いいずな書店 / 旺文社",lv:3,h:52};
  if(og){ out.push({b:og,tag:"文法(継続)",note:"Next Stage・Vintage・Scrambleは実質同格。持っている1冊で通す。"}); }
  else { out.push({b: st==="basic"?B.ooiwa:(st==="standard"?B.next:B.final), tag:"文法", note: st==="basic"?"先に講義系で理解してから網羅系に入る。":"網羅系を1冊。章ごとに×だけ回す。"}); }
  w.push(.25);
  /* 解釈(高2以上) */
  if(g!=="h1"){
    var ok = {kai70:B.kai70,kai100:B.kai100,pore:B.pore}[S.bk];
    out.push({b: ok || (st==="basic"?B.kai70:(st==="standard"?B.kai100:B.pore)),
      tag: ok?"解釈(継続)":"解釈", note:"1文ずつSVOCを書き込む。速さは今は捨てる。"});
    w.push(.25);
  }
  /* 長文 */
  if(g==="h3" || (g==="h2" && st!=="basic")){
    out.push({b: st==="basic"?B.hyp1:(st==="standard"?B.rules2:B.yat500), tag:"長文",
      note:"週1〜2題。解いた英文は必ず5回音読してから次に行く。"});
    w.push(.20);
  }
  /* 高3上位の追加 */
  if(g==="h3" && (S.aim==="hard"||S.aim==="top") && st==="advanced"){
    out.push({b:B.dragon,tag:"英作文",note:"難しい表現より、間違いのない英文を正しい構成で書く方が点になる。"});
    w.push(.10);
  }
  return dist(out,w,hours);
}

/* --- 数学プラン --- */
function planMath(hours){
  var g=S.grade, st=stage(S.hm,g), out=[], w=[];
  if(S.course==="bun" && g==="h3" && S.hm==="a" && S.aim==="local"){
    /* 文系で数学が最弱・地方国公立 → 網羅系1冊に絞る */
  }
  var om = {ao:B.ao,focus:B.focus,ki:B.ki,kiso:B.kiso,type100:B.type100,ichi:B.ichi}[S.bm];
  if(om){
    out.push({b:om,tag:"網羅系(継続)",note:"新しい網羅系は買わない。例題だけに絞って、×印の問題を回す。"});
  } else {
    out.push({b: st==="basic"?B.kiso:(st==="standard"?B.type100:B.ichi), tag:"網羅系",
      note: st==="basic"?"厚い網羅系より、短期で1周できる方を選ぶ。":"基礎問題精講よりもおすすめできる1冊。"});
  }
  w.push(.6);
  if(S.hm==="a"){ out.push({b:B.ukaru,tag:"計算",note:"偏差値45未満の失点は、解法よりも計算で落ちていることが多い。"}); w.push(.2); }
  else if(S.hm==="d" && g==="h3"){ out.push({b: S.course==="ri"?B.riPla:B.bunPla, tag:"発展演習", note:"網羅系が終わっている前提。終わっていなければ後回しでいい。"}); w.push(.25); }
  else { out.push({b:B.hatto,tag:"苦手単元",note:"確率が苦手なら、この1冊で潰しておくと2学期の失点が減る。"}); w.push(.2); }
  return dist(out,w,hours);
}

/* --- 国語プラン --- */
function planJpn(hours){
  var g=S.grade, st=stage(S.hj,g), out=[], w=[];
  /* 現代文 */
  if(st==="basic") out.push({b:B.funa,tag:"現代文(読み方)",note:"現代文が苦手な人の1冊目として第一推奨。図解が多く、論理展開が目で見える。"});
  else if(st==="standard") out.push({b:B.acc,tag:"現代文(演習)",note:"読み方の本と並行して演習量を確保する。"});
  else out.push({b:B.kaihatsu,tag:"現代文(演習)",note:"要約で論理を掴む。記述の練習にもなる。"});
  w.push(.35);
  /* 古文 */
  var oj = {step30:B.step30,ko315:B.ko315,madonna:B.madonna,tomii:B.tomii}[S.bj];
  if(S.bj==="none" || !oj){
    out.push({b:B.tomii,tag:"古文(文法)",note:"助動詞の活用が入っていないと、古文は一生読めるようにならない。"});
    out.push({b:B.ko315,tag:"古文(単語)",note:"学校配布の315やいろはにほへと330があればそれで十分。"});
    w.push(.2); w.push(.2);
  } else {
    out.push({b:oj,tag:"古文(継続)",note:"持っている1冊を最後まで。古文単語帳はどれを使っても大差ない。"});
    w.push(.25);
    if(g!=="h1"){ out.push({b: st==="advanced"&&g==="h3" ? B.jotatsu56 : B.jotatsu, tag:"古文(読解)", note:"文法確認と短い長文を交互に進められる。"}); w.push(.2); }
  }
  /* 漢文 */
  if(g==="h3"){ out.push({b:B.hayaoboe,tag:"漢文",note:"句法1冊を仕上げて過去問に行くのが最も効率的。2学期のうちに終わらせる。"}); w.push(.15); }
  return dist(out,w,hours);
}

function dist(items,w,hours){
  var sum = w.reduce(function(a,b){return a+b;},0);
  return items.map(function(it,i){
    var h = hours * (w[i]/sum);
    it.hours = Math.round(h*10)/10;
    it.goal = goalText(h, it.b, it.tag);
    return it;
  });
}

/* --- 週間タイムテーブル --- */
function timetable(mh){
  var r = ratios();
  var order = [["英語",r.e],["数学",r.m],["国語",r.j]];
  if(r.x>0) order.push(["理社",r.x]);
  order.sort(function(a,b){return b[1]-a[1];});
  var top1 = order[0][0], top2 = order[1][0], top3 = order[2][0];
  var last = order[3] ? order[3][0] : top3;

  var wdClub = mh.wdClub, wd = mh.wd, hd = mh.hd;
  var rows = [];

  rows.push({name:"部活がある平日", total:wdClub+"時間", blocks:[
    ["朝 15分","英単語","前日の範囲を赤シートで1周。新しい範囲には進まない"],
    ["移動・休み時間","英単語 / 古文単語","10分×2回。覚える回でなく思い出す回にする"],
    ["帰宅後すぐ "+Math.max(0.5,Math.round(wdClub*0.6*10)/10)+"時間", top1, "着替える前に机に座る。ここを逃すと戻れない"],
    ["寝る前 "+Math.max(0.3,Math.round(wdClub*0.4*10)/10)+"時間", "暗記＋今日の×の見直し", "頭を使う科目は入れない。翌朝に同じ範囲を再テスト"]
  ]});

  rows.push({name:"部活がない平日", total:wd+"時間", blocks:[
    ["朝 15分","英単語","毎日ここだけは同じにする"],
    ["1ブロック目 "+Math.round(wd*0.45*10)/10+"時間", top2, "思考が要る科目を先に置く。疲れる前に終わらせる"],
    ["2ブロック目 "+Math.round(wd*0.35*10)/10+"時間", top1, "解いたら答え合わせまでこのブロック内で終える"],
    ["寝る前 "+Math.round(wd*0.2*10)/10+"時間", top3+" / 暗記", "音読・単語・古文単語。手を止めない軽い作業"]
  ]});

  rows.push({name:"休日", total:hd+"時間", blocks:[
    ["午前 "+Math.round(hd*0.4*10)/10+"時間", top2, "いちばん重い科目を午前に。ここでその日が決まる"],
    ["午後前半 "+Math.round(hd*0.3*10)/10+"時間", top1, "長文・演習系。時間を計って解く"],
    ["午後後半 "+Math.round(hd*0.18*10)/10+"時間", last, "1週間で触らない日ができやすい科目をここで拾う"],
    ["夜 "+Math.round(hd*0.12*10)/10+"時間", "今週の×の解き直し", "週1回。新しい問題には進まない"]
  ]});

  return rows;
}

  /* 数字 */
  h += '<div class="stat">'+
    '<div><b>'+mh.total+'</b><span>1ヶ月に使える時間</span></div>'+
    '<div><b>'+mh.wdClub+'</b><span>部活日の実働(h)</span></div>'+
    '<div><b>'+d+'</b><span>共通テストまで(日)</span></div></div>';

  /* 1. 型 */
  h += '<div class="sect"><h3>1. 2学期に直す1点<em>夏の振り返りから</em></h3>'+
    '<div class="fix"><div class="t">'+T.fix+'</div>'+
    '<ul>'+T.todo.map(function(x){return "<li>"+esc(x)+"</li>";}).join("")+'</ul></div>';
  if(S.done==="c"||S.done==="d"){
    h += '<div class="warn"><div class="t">先に伝えておきます</div><p>夏の達成率が3割以下でも、2学期でやることは「取り返す」ではありません。取り返そうとして量を増やすと、また同じ崩れ方をします。下のゴールは、いまの時間で本当に終わる量に落としてあります。</p></div>';
  }
  if(S.fin==="n"){
    h += '<div class="note">1冊もやり切れていないなら、2学期の最優先は「1冊終わらせる経験」です。終わった1冊は、次に何を選ぶかの基準にもなります。</div>';
  }
  h += '</div>';

  /* 2. 1ヶ月ゴール */
  h += '<div class="sect"><h3>2. この1ヶ月のゴール<em>今日から30日</em></h3>';
  h += subjBlock("英語","sub-e",Math.round(hE)+"h / "+Math.round(r.e*100)+"%",pE);
  h += subjBlock("数学","sub-m",Math.round(hM)+"h / "+Math.round(r.m*100)+"%",pM);
  h += subjBlock("国語","sub-j",Math.round(hJ)+"h / "+Math.round(r.j*100)+"%",pJ);
  if(r.x>0){
    h += '<div class="subj sub-x"><div class="sh"><b>理科・社会</b><span>'+Math.round(hX)+'h / '+Math.round(r.x*100)+'%</span></div>'+
         '<div class="note">'+esc(planSci(hX))+'</div></div>';
  } else {
    h += '<div class="subj sub-x"><div class="sh"><b>理科・社会</b><span>枠なし</span></div>'+
         '<div class="note">'+esc(planSci(0))+'</div></div>';
  }
  if(S.test==="near"){
    h += '<div class="warn"><div class="t">定期テストが2週間以内</div><p>最初の2週間は、上のゴールを半分に落としてテスト範囲を優先してください。定期テストの範囲は、そのまま入試の範囲です。捨てたところは入試でも出ます。残り2週間で上のペースに戻します。</p></div>';
  } else if(S.test==="mid"){
    h += '<div class="note">定期テストが3〜4週間先なので、上のゴールはテスト週の1週間分を差し引いた量になっています。テスト週は新しい範囲に進まず、学校のワークだけにしてください。</div>';
  }
  h += '<div class="note">1ヶ月で1冊終わらない本があるのは、失敗ではありません。1ヶ月で回れるのは合計'+mh.total+'時間で、これが現実の上限です。問題は「どの範囲を残して、どこを切るか」で、ここだけは学年・志望校・いまの穴によって答えが変わります。<br>※ 難易度と学習時間は、STUDYLIKE塾が受験生の実績からまとめている目安です。持っている本は買い替えさせず、継続で組んでいます。数学の網羅系はIA・IIB・IIIの分冊ごとの時間です。</div>';
  h += '</div>';

  /* 3. 週間 */
  h += '<div class="sect"><h3>3. 1週間のタイムテーブル<em>3パターン</em></h3>';
  tt.forEach(function(row){
    h += '<div class="subj"><div class="sh"><b>'+esc(row.name)+'</b><span>実働 '+esc(row.total)+'</span></div>'+
      '<div class="tw"><table><tr><th>時間帯</th><th>科目</th><th>やること</th></tr>'+
      row.blocks.map(function(b){
        return '<tr><td><b>'+esc(b[0])+'</b></td><td>'+esc(b[1])+'</td><td>'+esc(b[2])+'</td></tr>';
      }).join("")+'</table></div></div>';
  });
  h += '<div class="note">この3パターンを、自分のカレンダーの曜日に貼り付けるだけで1週間が埋まります。全部埋めようとしないでください。週1日は予備日にして、崩れた分をそこで吸収します。</div></div>';

  /* 4. 手を出さなくていい本 */
  h += '<div class="sect"><h3>4. 今は手を出さなくていい本<em>時間を守るために</em></h3>'+
    '<div class="note">書店で目に入っても、'+gname+'のいまの段階では優先度が低い本です。どれも「ほとんどの受験生には不要」「オーバーワーク」に当たる本です。<br><br>'+
    NOGO.map(function(x){return "・"+esc(x);}).join("<br>")+
    '<br><br>やらない本を決めることも、2学期の計画のうちです。</div></div>';

  /* CTA */
  h += '<div class="cta">'+
    '<div class="limit">今月 5名まで</div>'+
    '<h3>この設計、本当にあなたに合っているか。現役京大生のリケが30分で見ます。</h3>'+
    '<p>ここまで出した内容は、答えてもらった16問から機械的に組んだものです。だいたいは合っています。ただし「'+esc(T.name)+'」の直し方も、'+Math.round(mh.total)+'時間の配り方も、本当は一人ひとり事情が違います。合っているかどうかを見るのは、人の仕事です。</p>'+
    '<ul>'+
      '<li>この結果を見ながら、あなたの状況で削る所・増やす所をその場で決めます</li>'+
      '<li>持っている参考書の順番を、志望校から逆算して並べ直します</li>'+
      '<li>部活・学校の課題を入れた上で、崩れない週の形にします</li>'+
      '<li>周りに言いにくい志望校でも、ここでは普通に話して大丈夫です</li>'+
    '</ul>'+
    '<p>無料・30〜60分・ビデオ通話(顔出しなしでOK)。勧誘は一切ありません。保護者の方の同席もできます。</p>'+
    '<div class="how">申し込み方法は<b>LINEに希望の日程を3つ送るだけ</b>です。<br>例：<b>9/8(月)19時 / 9/10(水)20時 / 9/13(土)10時</b><br>枠が埋まり次第、今月分は締め切ります。</div>'+
    '</div>';

  h += '<div class="nav" style="margin-top:22px"><button class="btn ghost" onclick="restart()">もう一度やる</button></div>'+
    '<div class="foot">STUDYLIKE塾<br>この結果は学習計画の目安であり、合否を保証するものではありません。</div>';

  return el('<div>'+h+'</div>');
}

function subjBlock(name,cls,meta,items){
  var h = '<div class="subj '+cls+'"><div class="sh"><b>'+esc(name)+'</b><span>'+esc(meta)+'</span></div>';
  items.forEach(function(it){
    h += '<div class="book"><div class="bn">'+esc(it.b.n)+'<span style="font-size:12px;color:var(--muted);font-weight:600"> ／ '+esc(it.tag)+'</span></div>'+
      '<div class="bm">'+esc(it.b.p)+'　難易度 '+esc(it.b.lv)+'　1周 '+esc(it.b.h)+'h'+(it.b.unit?"("+esc(it.b.unit)+")":"")+'</div>'+
      '<div class="bg">'+it.goal.t+'<div style="font-size:12px;color:var(--muted);margin-top:4px">今月この本に回せる時間：'+it.hours+'時間</div></div>'+
      '<div class="note" style="margin-top:6px">'+esc(it.note)+'</div></div>';
  });
  return h+'</div>';
}

function restart(){ S={}; logged=false; page=-1; render(); }
window.restart=restart;

/* ============================================================
   回答ログの送信
   選択肢のコード(a/b/c)ではなく、画面に出ていた日本語ラベルで送る。
   スプレッドシート側で読んだ時に、そのまま意味が分かる状態にするため。
   ============================================================ */
function labelOf(k, v){
  for(var i=0;i<STEPS.length;i++){
    var qs = STEPS[i].qs;
    for(var j=0;j<qs.length;j++){
      if(qs[j].k === k && qs[j].opts){
        for(var o=0;o<qs[j].opts.length;o++){
          if(qs[j].opts[o][0] === v) return qs[j].opts[o][1];
        }
      }
    }
  }
  return v || "";
}
function firstBook(items){ return (items && items[0]) ? items[0].b.n : ""; }
function stripTag(t){ return String(t).replace(/<[^>]+>/g, ""); }

/* 営業AIが最初に読む1行。「1ヶ月で1周に届かない本」が面談の議題になる */
function meetingHook(pE, pM, pJ){
  var all = [];
  pE.forEach(function(x){ all.push(["英語", x]); });
  pM.forEach(function(x){ all.push(["数学", x]); });
  pJ.forEach(function(x){ all.push(["国語", x]); });
  /* 一番時間を注ぐのに1周に届かない本を選ぶ。枝葉の本ではなく中心の本が議題になる */
  var worst = null;
  all.forEach(function(a){
    if(a[1].goal.p >= 100) return;
    if(!worst || a[1].hours > worst[1].hours) worst = a;
  });
  if(!worst){
    return "全科目1ヶ月で1周できる配分。量より、ペースが速すぎないかの確認が議題。";
  }
  return worst[0] + "の「" + worst[1].b.n + "」が1日" + worst[1].goal.m +
         "分では1ヶ月に約" + worst[1].goal.p + "%しか進まない。どこを残してどこを切るかが面談の議題。";
}

function sendLog(mh, T, pE, pM, pJ){
  if(logged) return;
  logged = true;
  if(!LOG_ENDPOINT) return;
  var now = new Date();
  var pad = function(n){ return (n<10?"0":"")+n; };
  var row = {
    "日時": now.getFullYear()+"/"+pad(now.getMonth()+1)+"/"+pad(now.getDate())+" "+pad(now.getHours())+":"+pad(now.getMinutes()),
    "LINEの名前": S.name || "",
    "受付ID": (S.name || "") + "-" + pad(now.getMonth()+1) + pad(now.getDate()) + "-" + pad(now.getHours()) + pad(now.getMinutes()),
    "学年": labelOf("grade", S.grade),
    "文理": labelOf("course", S.course),
    "志望帯": labelOf("aim", S.aim),
    "英語の偏差値": labelOf("he", S.he),
    "数学の偏差値": labelOf("hm", S.hm),
    "国語の偏差値": labelOf("hj", S.hj),
    "理社の状況": labelOf("sci", S.sci),
    "夏の達成度": labelOf("done", S.done),
    "崩れた原因": labelOf("why", S.why),
    "やり切った実感": labelOf("fin", S.fin),
    "持っている英単語帳": labelOf("bw", S.bw),
    "持っている英文法": labelOf("bg", S.bg),
    "持っている英文解釈": labelOf("bk", S.bk),
    "持っている数学網羅系": labelOf("bm", S.bm),
    "持っている古文": labelOf("bj", S.bj),
    "部活": labelOf("club", S.club),
    "平日の可処分時間": labelOf("wd", S.wd),
    "休日の可処分時間": labelOf("hd", S.hd),
    "次の定期テスト": labelOf("test", S.test),
    "判定タイプ": T.name,
    "2学期に直す1点": stripTag(T.fix),
    "月間の可処分時間(h)": mh.total,
    "英語の1冊目": firstBook(pE),
    "数学の1冊目": firstBook(pM),
    "国語の1冊目": firstBook(pJ),
    "面談フック": meetingHook(pE, pM, pJ)
  };
  try{
    fetch(LOG_ENDPOINT, {
      method: "POST",
      mode: "no-cors",
      headers: { "Content-Type": "text/plain;charset=utf-8" },
      body: JSON.stringify(row)
    });
  }catch(e){ /* 送信に失敗しても結果表示は止めない */ }
}

render();
</script>
