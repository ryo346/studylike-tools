<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>最低ライン診断</title>
<style>
:root{--navy:#1f3a5f;--navy2:#2f5385;--bg:#f4f6f9;--card:#fff;--line:#d9dee6;--text:#1c2430;--sub:#5a6677;--ok:#2d7a4f;--close:#b7791f;--prio:#8a4b9e;--soft:#eaf0f8;--acc:#c2410c;--accbg:#fff4e8;--accline:#f0a868}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.75 -apple-system,"Hiragino Sans","Hiragino Kaku Gothic ProN",Meiryo,sans-serif}
#app{max-width:680px;margin:0 auto;padding:16px 16px 96px}
h1{font-size:22px;line-height:1.4;margin:8px 0 6px;color:var(--navy)}
h2{font-size:18px;margin:0 0 10px;color:var(--navy)}
h3{font-size:16px;margin:16px 0 6px;color:var(--navy)}
p{margin:0 0 12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin:0 0 14px}
.sub{color:var(--sub);font-size:14px}
.small{font-size:14px}
.prog{height:6px;background:var(--line);border-radius:3px;margin:6px 0 16px;overflow:hidden}
.prog>i{display:block;height:100%;background:var(--navy2)}
.btn{display:block;width:100%;min-height:48px;padding:12px 16px;margin:8px 0;border:1px solid var(--navy);background:#fff;color:var(--navy);border-radius:10px;font:inherit;font-weight:600;text-align:center;cursor:pointer;text-decoration:none}
.btn.primary{background:var(--navy);color:#fff}
.btn.sel{background:var(--navy);color:#fff}
.btn.ghost{border-color:var(--line);color:var(--sub);font-weight:500}
.btn.acc{background:var(--acc);border-color:var(--acc);color:#fff;font-size:18px;min-height:56px}
.row{display:flex;gap:8px;flex-wrap:wrap}
.row .btn{flex:1 1 30%;margin:4px 0;min-width:84px}
select{width:100%;min-height:48px;padding:10px;border:1px solid var(--line);border-radius:10px;font:inherit;background:#fff;color:var(--text)}
label.chk{display:flex;align-items:center;gap:10px;min-height:44px;padding:4px 0}
label.chk input{width:22px;height:22px}
.badge{display:inline-block;padding:2px 12px;border-radius:999px;color:#fff;font-size:14px;font-weight:700;background:rgba(255,255,255,.22);border:1px solid rgba(255,255,255,.5)}
.hero{background:var(--navy);color:#fff;border-radius:14px;padding:18px 16px;margin:0 0 14px}
.hero h1{color:#fff;font-size:24px;margin:10px 0 8px}
.hero p{color:#e8eef7;margin:0 0 8px}
.hero .sub{color:#b9c8de}
.focus{background:#fff;border:2px solid var(--navy);border-radius:12px;padding:14px 16px;margin:0 0 14px;font-size:20px;font-weight:800;line-height:1.5;color:var(--navy)}
.tonight{background:var(--soft);border-color:#c7d6ec}
.tonight .big{font-size:19px;font-weight:700;line-height:1.55;margin:0}
.point{display:flex;gap:12px;padding:12px 0;border-top:1px solid var(--line)}
.point:first-of-type{border-top:0}
.num{flex:none;width:32px;height:32px;border-radius:50%;background:var(--navy);color:#fff;font-weight:800;display:flex;align-items:center;justify-content:center;margin-top:2px}
.point .role{font-size:18px;font-weight:800;color:var(--navy);line-height:1.4}
.chip{display:inline-block;background:var(--soft);color:var(--navy);border-radius:6px;padding:0 8px;font-size:13px;font-weight:700;margin-right:6px}
.meta{font-size:14px;color:var(--sub);margin-top:4px}
.tip{border-left:5px solid var(--navy2);background:#fff;padding:8px 12px;margin:10px 0}
.tip b{display:block;color:var(--navy);font-size:16px}
.coach li{margin:6px 0}
.sendbox{background:var(--accbg);border:3px solid var(--accline);border-radius:14px;padding:16px;margin:0 0 14px}
.sendbox h2{color:var(--acc);font-size:21px;line-height:1.45}
.ben{display:flex;gap:10px;margin:12px 0}
.ben .ck{flex:none;width:28px;height:28px;border-radius:50%;background:var(--acc);color:#fff;font-weight:800;display:flex;align-items:center;justify-content:center}
.ben b{display:block;font-size:18px;color:var(--navy);line-height:1.45}
.ben span{font-size:14px;color:var(--text)}
.hl{background:linear-gradient(transparent 62%,#ffd8a8 62%);font-weight:800}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{border-bottom:1px solid var(--line);padding:6px 4px;text-align:left;vertical-align:top}
th{color:var(--sub);font-weight:600}
details{margin:8px 0}
summary{cursor:pointer;min-height:44px;display:flex;align-items:center;font-weight:600;color:var(--navy)}
.st-ok{color:var(--ok);font-weight:700}.st-late{color:var(--close);font-weight:700}.st-un{color:var(--prio);font-weight:700}
.day{border-top:1px solid var(--line);padding:8px 0}
.day b{color:var(--navy)}
.task{display:flex;gap:10px;align-items:flex-start;min-height:44px;padding:4px 0}
.task input{width:22px;height:22px;margin-top:4px;flex:none}
.q{font-weight:700;margin:0 0 8px}
textarea{width:100%;min-height:96px;border:1px solid var(--line);border-radius:10px;padding:10px;font:inherit;background:#fff}
.seg{display:flex;gap:6px;margin:4px 0}
.seg.g4{display:grid;grid-template-columns:repeat(4,1fr)}
.seg button{flex:1;white-space:nowrap;min-height:44px;border:1px solid var(--line);background:#fff;border-radius:8px;font:inherit;font-size:14px;cursor:pointer}
.seg button.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.rolebox{border:1px solid var(--line);border-radius:10px;padding:10px;margin:10px 0;background:#fbfcfe}
.rolebox .rn{font-weight:800;color:var(--navy)}
.sticky{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);padding:8px 16px;z-index:9;box-shadow:0 -2px 8px rgba(0,0,0,.06)}
.sticky .btn{max-width:648px;margin:0 auto;min-height:48px;font-size:16px}
@media print{body{background:#fff}.noprint,.sticky{display:none!important}.card{break-inside:avoid}}
</style>
</head>

、いまの時間で{target}までに終わります。{univ}に向けて、順番を守ることが一番の近道です。"], "verdict_close_title": ["あと少しで、全部間に合います", "ほぼ間に合います。少しだけ工夫を", "間に合う道があります。順番が大切です", "{target}までに終えられる計画です。期限の前倒しだけ注意"], "verdict_close_body": ["{univ}の最低ラインにあたる必須の範囲は、{target}の前に終わります。ただし、途中の期限に少し遅れる所があるので、下の順番を守ってください。", "必須の範囲は{target}までに終わる計算です。理想の期限より遅れる所があるため、下の3つを先に進めるのがポイントです。", "{univ}を目指すうえで、必須の範囲は{target}に間に合います。途中の目標より遅れる分は、順番で取り返せます。", "全部終えられる計画です。ただ、早めに終えておきたい本が遅れ気味なので、「今夜やる1つ」から始めましょう。"], "verdict_prio_title": ["優先順位を決めて、確実に進めよう", "全部は難しくても、取れる所から確実に", "「何をやらないか」を決める段階です", "ここからは、順番と割り切りが力になります"], "verdict_prio_body": ["{univ}の必須の範囲を{target}までに全部終えるには、いまの時間だと一部が先送りになります。だからこそ、順番が大切です。下の3つから始めれば、期限の近いものから確実に進みます。", "必須の範囲は、いまの時間だと全部は収まりません。でも、期限の近い順に進めれば、大事なところから確実に終えられます。まずは、下の3つから。", "{univ}を目指すうえでの必須の範囲は量が多く、{target}までに全部は届かない計算です。それでも、順番さえ決まれば迷いません。下の3つから、確実に積み上げましょう。", "{target}までの時間を考えると、必須の範囲は一部が先になります。これは珍しいことではなく、「何から終わらせるか」を決める段階に来ている、ということです。下の3つから始めましょう。"], "tonight_intro": ["今夜やる1つ", "まずはこれだけ(今夜)", "今夜の1つ"], "tonight_body": ["{subject}:{role}を{min}分{bookPhrase}。ここから始めると、期限の近い順に進められます。", "{subject}の{role}を{min}分{bookPhrase}。迷ったら、まずこれ。", "今夜は、{subject}の{role}を{min}分{bookPhrase}。これを終えたら、今日はOKです。"], "extra_ok": ["平日あと{wd}分(休日あと{we}分)増やせたら、期限どおりに終わる計算です。", "もし平日に{wd}分、休日に{we}分だけ足せたら、期限の前倒しにも間に合います。", "平日+{wd}分・休日+{we}分が作れれば、{univ}に向けた計画は期限どおりに進みます。"], "defer_intro": ["後回しの候補(割り切る所)", "今回は割り切る候補", "時間が足りないときに外す候補"], "defer_note": ["ここを外すかどうかは、志望校の過去問や科目の配点と相談して決めてください。迷ったら、無料面談で一緒に決めます。", "全部をやるのではなく、「確実に終える」ことを優先します。外す所に迷ったら、リケ先輩に結果を送ってください。", "割り切るのは逃げではなく、戦略です。どこを外すか迷ったら、結果を送ってもらえれば一緒に考えます。"], "g12_title_short": ["短い時間でも、前に進めます", "忙しくても、ゼロの日を作らなければ進みます", "部活がある人の勉強は、「量」より「続けること」"], "g12_title_mid": ["この時間なら、しっかり進めます", "いまの時間で、確実に積み上げられます", "このペースで、学年末にここまで届きます"], "g12_title_long": ["十分な時間です。基礎を固めきれます", "この時間なら、先まで進められます", "余裕がある分、基礎を丁寧に仕上げられます"], "g12_body": ["{univ}を目指すうえで、高1・高2のうちにやっておきたい参考書を、{group}の目安で並べました。いまの時間(平日{wd}分・休日{we}分)なら、学年末までに下の所まで届きます。", "{univ}志望なら、いまは基礎を順番に積む時期です。平日{wd}分・休日{we}分で、学年末までに届く範囲を出しました。", "時期の焦りに頼らず、いまの時間でできる分を積み上げる計画です。平日{wd}分・休日{we}分なら、{univ}に向けて学年末までにここまで進めます。", "高1・高2は、差をつける時期ではなく、後から差をつけられないための土台を作る時期。平日{wd}分・休日{we}分で、学年末までにここまで届きます。"], "g12_club": ["部活がある日は、最小メニューだけでもOK。大事なのは、ゼロの日を作らないことです。", "部活でヘトヘトな日は、下の「ゼロの日を作らない最小メニュー」だけで十分です。", "忙しい日は、最小メニューに切り替えてください。1日おきに止まるより、毎日少しの方が、1か月後に大きな差になります。"], "g12_more": ["平日にあと{min}分作れたら、学年末までにここまで増えます。", "もし平日に{min}分だけ足せたら、到達点がここまで伸びます。", "平日+{min}分で、学年末の到達点はこう変わります。"], "cta_meeting": ["自分の場合はどう進めればいいか、無料面談で具体的に相談できます(プロフィールのハイライト『無料面談』から)。", "計画に迷ったら、無料面談で一緒に見直せます(プロフィールのハイライト『無料面談』から)。", "どこを外せばいいか分からない人は、無料面談で一緒に決められます。"], "disclaimer": "この診断は、参考書マスターBookの「1周の学習時間」をもとにした目安です。合格を保証するものではありません。個人差があります。", "extra_close": ["平日あと{wd}分(休日あと{we}分)増やせたら、必須はすべて{target}の前に終わる計算です。期限より遅れる所は出ますが、順番で取り返せます。", "平日に{wd}分、休日に{we}分足せたら、必須の範囲は{target}までに終わる見通しになります。", "平日+{wd}分・休日+{we}分が作れれば、必須は{target}の前に終わります(途中の目標より遅れる所は、順番で調整します)。"], "focus_line": ["まず「{subject}の{role}」から。ここが、いちばん伸びる近道です。", "最初にやるのは「{subject}の{role}」。ここを動かすと、他の科目も進みやすくなります。", "あなたの最優先は「{subject}の{role}」。まずここだけに集中しましょう。"], "focus_line_g12": ["いまは「{subject}の{role}」から。毎日少しでも、ここを続けるのがいちばん伸びます。", "最初にやるのは「{subject}の{role}」。短い時間でも、続ければ必ず積み上がります。", "まず「{subject}の{role}」。ここを積むと、あとの勉強が全部ラクになります。"], "points_title": ["これをやれば伸びる3つ", "あなたが伸びるポイント(この順番で)", "まず、この3つ"], "coach_time_short": ["使える時間が短い分、「1日1つ」に絞りましょう。あれもこれもより、1つを毎日続ける方が伸びます。", "時間が短い人ほど、順番が大切です。今日は1つだけ、終わらせることを目標にしてください。"], "coach_time_mid": ["使える時間は、使い方次第で十分な量です。1つを終わらせてから次へ、の順番を守ると、無駄なく進みます。", "いまの時間なら、1日に2つのことを並行できます。同じ科目を詰めるより、2科目を回す方が定着します。"], "coach_time_long": ["時間がある分、「何をやるか」を絞ることが一番の差になります。同じ本を何周も回す方が、新しい本を足すより伸びます。", "しっかり時間が取れるので、1日の中で「理解」と「演習」を分けると効率が上がります。午前は理解、午後は問題、など。"], "coach_focus": ["いちばん時間がかかるのは{subject}(必須で約{hours}時間)。ここを先に動かすと、全体がラクになります。", "{subject}が、あなたの中でいちばん量の多い科目です(必須で約{hours}時間)。毎日少しずつでも、止めないのがコツです。"], "coach_focus_g12": ["いまいちばん時間を使うのは{subject}。基礎を固めるこの時期は、ここが土台になります。", "{subject}を軸に進めます。毎日の積み重ねが、あとで大きな差になります。"], "coach_club": ["部活がある人は、毎日同じ時間に少しだけ、が続けやすいです。「帰宅後の最初の10分」など、決まった時間を作りましょう。", "部活で疲れた日は、最小メニューに切り替えてOK。続けることが、いちばん大きな力になります。"], "coach_medical": ["医学部志望は、英語・数学・理科で安定して点を取れることが大切です。志望校の配点と二次の科目は、必ず公式の情報で確認してください。"], "coach_g3_late": ["共通テストまでの日数が少ない時期は、新しい本に手を出さず、いまの本の×の問題だけを回すのが効果的です。"], "send_head": ["リケ先輩に結果を送ると、豪華7大特典がもらえます", "結果を送るだけで、豪華7大特典"], "send_b1_title": ["やらなくていいことが分かる"], "send_b1_body": ["時間が足りないときに、外してよい順番まで、あなたの志望に合わせてお伝えします。"], "send_b2_title": ["実践アドバイスが全部そろう"], "send_b2_body": ["ポモドーロなど、勉強の質が上がる実践のコツ全{n}個を、あなたの状況に合わせてお渡しします。"], "send_b3_title": ["月ごとのチェックリストと参考書の使い方"], "send_b3_body": ["いつまでに何を終えるかを月ごとに整理し、参考書の使い方の詳細も付けます。"], "send_b4_title": ["毎週3名は、無料面談(勉強計画作成面談)"], "send_b4_body": ["あなた専用の勉強計画を、リケ先輩と一緒につくります。"], "send_note": ["送るのは結果の文章だけです。個人情報は不要です。"], "send_how": ["下のボタンを押すと、LINEが開きます。結果の文章が入っているので、送信を押すだけです。"], "teaser_defer": ["「やらなくていいこと」と「外す順番」は、深掘り版でお伝えします。", "時間が足りないときの「割り切り方」は、深掘り版で、あなたの結果に合わせてお伝えします。"], "tips": [{"id": "pomodoro", "kind": "集中", "tags": ["all", "長時間"], "title": "ポモドーロ・テクニック", "body": "25分集中して、5分休む。これを1セットにして、4セットやったら15〜30分しっかり休みます。タイマーを必ずかけて、25分の間はスマホを見ない。「25分だけ」と決めると、始めるハードルも下がります。"}, {"id": "five-min", "kind": "始める", "tags": ["all", "短時間", "部活"], "title": "「5分だけ」スタート", "body": "やる気が出ない日は、「5分だけやる」と決めて机に向かいます。始めてしまえば続けられることが多く、5分で終わってもOK。ゼロの日を作らないための、いちばん強い方法です。"}, {"id": "phone", "kind": "集中", "tags": ["all", "長時間"], "title": "スマホは別の部屋へ", "body": "勉強中は、スマホを見えない・届かない場所に置きます。通知が来るだけで、集中は途切れます。タイマーだけ別に用意しましょう。"}, {"id": "night-plan", "kind": "計画", "tags": ["all", "高3", "高1・2"], "title": "寝る前に「明日の最初の1つ」を決める", "body": "寝る前に、明日いちばん最初にやることを1つだけ決めておきます。朝、何をやるか迷う時間がなくなって、すぐ始められます。"}, {"id": "recall", "kind": "暗記", "tags": ["all", "暗記", "英語", "社会"], "title": "見直すより「思い出す」", "body": "単語や用語は、答えを隠して、まず自分で思い出してから確認します。眺めて覚えた気になるより、思い出す練習の方が、定着します。"}, {"id": "spaced", "kind": "暗記", "tags": ["all", "暗記", "英語", "社会", "国語"], "title": "翌日・3日後・1週間後に見直す", "body": "覚えたいことは、翌日、3日後、1週間後にもう一度。間をあけて見直すと、長く覚えていられます。1日でまとめてやるより効果的です。"}, {"id": "x-only", "kind": "復習", "tags": ["数学", "理科", "all"], "title": "×の問題だけ繰り返す", "body": "1周目で、間違えた問題に×をつけます。2周目は×だけ。全部やり直すより、半分の時間で終わり、点に直結します。"}, {"id": "think5", "kind": "数学", "tags": ["数学", "理科"], "title": "解説を見る前に5分考える", "body": "分からない問題は、すぐ解説を見ずに、5分だけ自分で考えます。考えた跡があると、解説の内容が頭に入ります。5分たっても分からなければ、見てOKです。"}, {"id": "why-memo", "kind": "復習", "tags": ["数学", "理科", "高3"], "title": "「なぜその式?」を一言メモ", "body": "解いたあと、解き方の理由を一言だけ書きます(「共通部分が出るから因数分解」など)。解法が「型」として残り、初見の問題でも使えるようになります。"}, {"id": "vocab-split", "kind": "暗記", "tags": ["英語", "暗記", "短時間"], "title": "単語は10分×3回に分ける", "body": "単語を1時間まとめてやるより、朝・昼・夜に10分ずつ。同じ時間でも、分けた方が記憶に残ります。"}, {"id": "read-aloud", "kind": "英語", "tags": ["英語"], "title": "長文は解いたあとに音読", "body": "長文は、解いたあとに意味を取りながら音読します。英語の語順で理解する力がつき、読む速さが上がります。リスニングにも効きます。"}, {"id": "time-attack", "kind": "共テ", "tags": ["英語", "国語", "高3", "直前期"], "title": "共通テスト形式は時間を測る", "body": "過去問や実戦問題は、必ず時間を測って解きます。大問ごとに目標時間を決めておくと、本番の時間配分が体に入ります。"}, {"id": "kobun-words", "kind": "国語", "tags": ["国語", "短時間", "部活"], "title": "古文単語は通学中に5個ずつ", "body": "古文単語は、通学や休み時間に5個ずつ。短い時間でできて、続けると読める文が一気に増えます。"}, {"id": "evidence", "kind": "国語", "tags": ["国語"], "title": "現代文は「根拠に線」を引く", "body": "設問の答えの根拠を、本文に線を引いて確認します。感覚で選ぶ癖がなくなり、点が安定します。"}, {"id": "kanbun", "kind": "国語", "tags": ["国語", "短時間"], "title": "漢文の句法は声に出す", "body": "漢文の句法は、読み下しを声に出して覚えます。耳と口を使うと、短期間で定着します。"}, {"id": "diagram", "kind": "理科", "tags": ["理科"], "title": "物理・化学は図を自分で描く", "body": "物理は力や運動の図、化学は反応の流れの図を、自分で描いて説明します。図が描ければ、問題の8割は解けます。"}, {"id": "chem-order", "kind": "理科", "tags": ["理科"], "title": "化学は理論→無機→有機の順", "body": "化学は、理論が土台です。理論を固めてから無機・有機に進むと、暗記だけにならず、理解で進められます。"}, {"id": "bio-pair", "kind": "理科", "tags": ["理科", "暗記"], "title": "生物の用語は図とセットで", "body": "用語だけを覚えず、図(構造や流れ)とセットで覚えます。考察問題でも、図から答えを組み立てられます。"}, {"id": "why-flow", "kind": "社会", "tags": ["社会"], "title": "歴史は「なぜ」を一言で言う", "body": "出来事を覚えるより、「なぜ起きたか」を一言で言えるか確認します。流れで理解すると、暗記が少なくて済みます。"}, {"id": "map", "kind": "社会", "tags": ["社会"], "title": "地理は地図と資料を見ながら", "body": "地理は、必ず地図や資料を開いて学びます。共通テストは資料の読み取りが中心なので、見る習慣が点になります。"}, {"id": "sleep", "kind": "睡眠", "tags": ["all", "高3", "高1・2"], "title": "睡眠も勉強時間の一部", "body": "睡眠を削ると、暗記が定着せず、集中も落ちます。暗記は寝る前に見て、朝に確認すると効率的です。目安は6時間以上。"}, {"id": "gap-time", "kind": "短時間", "tags": ["短時間", "部活", "all"], "title": "スキマ時間は「紙1枚」で", "body": "通学や休み時間に、単語や一問一答を1枚だけ持ち歩きます。重い本は持たず、紙1枚。毎日のスキマが、1か月で大きな量になります。"}, {"id": "zero-day", "kind": "短時間", "tags": ["短時間", "部活", "高1・2"], "title": "ゼロの日を作らない", "body": "部活やテストでできない日も、単語を10個だけ、例題を1問だけ。やる日と全くやらない日を作るより、毎日少しの方が定着します。"}, {"id": "spare-day", "kind": "計画", "tags": ["高3", "all"], "title": "週に1日は予備日をつくる", "body": "計画には、最初から「遅れを取り戻す日」を週に1日入れます。予定どおりに進まなくても、崩れずに続けられます。"}, {"id": "weekly", "kind": "計画", "tags": ["all", "高3", "高1・2"], "title": "日曜の夜に5分だけ振り返る", "body": "できた・できなかったを見て、来週のやることを調整します。振り返りの5分が、計画のズレを小さくします。"}, {"id": "mistake-type", "kind": "復習", "tags": ["高3", "直前期", "all"], "title": "間違いの理由を3つに分ける", "body": "模試や過去問の間違いは、「知識不足」「ケアレスミス」「時間不足」に分けます。直すことが分かれば、次にやることが決まります。"}, {"id": "last-14", "kind": "直前期", "tags": ["直前期", "高3"], "title": "直前の2週間は、新しい本に手を出さない", "body": "直前期は、新しい本を足さず、やった本の×だけを見直します。完璧に近い1冊が、点になります。"}, {"id": "desk", "kind": "集中", "tags": ["all", "長時間"], "title": "机の上は、今日使う1冊だけ", "body": "机の上に、今日使うものだけを出します。目に入るものが少ないほど、集中しやすくなります。"}, {"id": "goal-output", "kind": "計画", "tags": ["all", "高3"], "title": "今日のゴールは「時間」でなく「量」で決める", "body": "「2時間やる」より、「単語50個」「例題5問」のように、成果で決めます。終わったら、そこで終了していい。やり切った感覚が、続ける力になります。"}, {"id": "note-less", "kind": "復習", "tags": ["all", "数学", "理科"], "title": "ノートを作りすぎない", "body": "きれいなまとめノートを作るより、×の問題に印と一言を書く方が、時間当たりの効果は大きいです。見返すのは、その1枚だけ。"}, {"id": "reward", "kind": "始める", "tags": ["all", "部活"], "title": "終わったあとの楽しみを先に決める", "body": "勉強を終えたあとにやることを、先に決めておきます(好きな動画を15分など)。「終わったら楽しみがある」と思うと、始めやすくなります。"}], "edu": {"title": "計画は、立てて終わりじゃない", "lead": "リケ先輩のこれまでの面談の実感では、計画を立てている受験生は多いのに、最後まで実行できている人は少数です。「何から」「どこまで」が決まっていても、続かない理由は3つあります。", "reasons": [{"title": "崩れたとき、直し方が分からない", "body": "予定どおりに進まない日は必ず来ます。そのとき、どこをどう直せばいいかが分からないと、計画ごと止まります。"}, {"title": "モチベーションが続かない", "body": "1人だと、いまのやり方が合っているのかが分からず、不安が続きます。不安なまま量だけ増やしても、続きません。"}, {"title": "身近に頼れる人がいない", "body": "いちばん大きいのが、これです。行き詰まったとき、あなたの状況を知っている人にすぐ聞けるかどうかで、続けられる力が変わります。"}], "pro_title": "だから、計画は「プロと一緒に」つくる", "pro_body": "学校の先生は、クラス全体を見る立場です。普通の塾は、授業が中心で、計画づくりが仕事ではありません。計画のプロに見てもらうと、こう変わります。", "pro_points": ["あなたの現在地から逆算した、あなた専用の計画になる", "崩れたら、すぐ直せる(定期的な見直し)", "迷ったとき、すぐ相談できる"], "bridge": "この診断の計画は、一般的な目安です。あなた専用の完成版は、無料面談で、プロと一緒に作れます。"}, "meeting": {"title": "リケ先輩との無料面談(勉強計画作成面談)でできること", "lead": "診断では出せない、あなた専用のものを、面談でつくります。オンラインなので、自宅から参加できます。所要時間は30分〜1時間。保護者の方の同席は自由です(いてもいなくてもOK)。", "items": [{"title": "あなた専用の「勉強計画」づくり", "body": "模試の結果と、いまの進み具合から、合格までの逆算マップと、今週の7日分の計画まで。面談のあとに、あなた専用の「学習設計シート」を、全員にお渡しします。"}, {"title": "参考書の見直し", "body": "いま使っている本を見て、続ける本と、やめる本を決めます。「やらないこと」まで、はっきり決めます。"}, {"title": "あなたに合った勉強法の相談", "body": "これまで続かなかった理由から、続けられるやり方を一緒に考えます。部活やテストとの両立も。"}, {"title": "不安・疑問の相談", "body": "志望校のこと、時間のこと、何でも聞けます。聞くだけでもOKです。"}], "steps_title": "面談までは、3ステップ", "steps": ["下のボタンで、診断結果といっしょに「面談希望」を送る", "リケ先輩からのLINEで、日程を決める", "オンラインで面談(自宅から)"], "btn_main": "結果を送って、7大特典をもらう", "btn_meeting": "結果を送って、無料面談も希望する", "note": "面談は無料です。毎週3名限定のため、枠がいっぱいの週は、来週に優先してご案内します。"}, "features_title": "結果を送ると、もらえる豪華7大特典", "features_sub": "すべて、あなたの学年・志望・使える時間に合わせて、自動で作ってお届けします。", "features": [{"title": "やらなくていいことリスト", "body": "時間が足りないとき、外してよい本と、外す順番を、あなた専用に。"}, {"title": "あなたに合った勉強法ガイド", "body": "本ごとの「やり方」と、1周にかかる日数の目安。"}, {"title": "月ごとのチェックリスト", "body": "いつまでに何を終えるかを、月ごとに整理。"}, {"title": "勉強の質が上がる{n}のコツ", "body": "ポモドーロほか、全部。あなたに合う順に。"}, {"title": "1日のタイムテーブル例", "body": "平日・休日・忙しい日の、そのまま使える時間割。"}, {"title": "計画が崩れたときの立て直しシート", "body": "崩れても戻れる3ステップと、週のふりかえり。"}, {"title": "保護者の方へ:見守りガイド", "body": "声かけの例と、計画の見方。"}], "feature_plus": {"title": "さらに、毎週3名限定:無料面談(勉強計画作成面談)", "body": "結果を送ってくれた方のうち、毎週3名に、リケ先輩との無料面談をご案内します。あなた専用の勉強計画を、いっしょに作ります。くわしくは、すぐ下の「無料面談でできること」へ。"}, "deep": {"title": "あなた専用 深掘り版", "intro": ["診断の結果を送ってくれて、ありがとうございます。ここからは、あなたの学年・志望・使える時間に合わせた、7大特典です。", "結果を送ってくれた、あなたへ。7大特典を、あなた専用につくりました。"], "plan_first": "まず、特典を読む前に。この中身は、一般的な目安から作った「下書き」です。完成版は、無料面談で一緒に作ります。", "nn_title": "特典1 やらなくていいことリスト", "nn_lead": "「全部やる」は、続きません。やらないことを先に決めるのが、続けるコツです。", "nn_defer_title": "時間が足りないときに、外す順番(上から外す)", "nn_defer_none": "いまの時間なら、必須の範囲は収まる計算です。外す必要はありません。「推奨」の本は、必須が終わってから考えましょう。", "nn_rec": "余裕があれば、のもの。必須が終わるまでは、やらなくてOK", "nn_high": "難関向けの本。あなたの志望では、いまは不要", "nn_second": "同じ役割の本を、もう1冊足さなくてOK", "nn_second_body": "「{role}」は、1冊を3周する方が伸びます。他の候補({others})に手を出さなくて大丈夫です。", "nn_rules": ["新しい本を買い足すより、いまの本の×だけを回す", "まとめノートを作りすぎない(×に印と一言だけ)", "志望校で使わない科目・範囲に、時間を使わない", "完璧にしてから次へ、はやめる(1周目は8割でOK)"], "howto_title": "特典2 あなたに合った勉強法ガイド", "howto_lead": "本ごとの「やり方」と、1周にかかる日数の目安です。日数は、いまの時間(1日あたりの分数)で計算しています。", "month_title": "特典3 月ごとのチェックリスト", "month_lead": "いつまでに何を終えるかを、月ごとに並べました。終わったらチェックしてください。", "tips_title": "特典4 勉強の質が上がる{n}のコツ", "tips_lead": "あなたの状況に合うものを上に並べました。まず、上の3つだけ試してください。", "time_title": "特典5 1日のタイムテーブル例", "time_lead": "25分やって5分休む(ポモドーロ)の形で、そのまま使える時間割にしました。順番は、期限の近いものから。", "rec_title": "特典6 計画が崩れたときの立て直しシート", "rec_lead": "崩れるのは、普通のことです。大事なのは、戻り方を決めておくこと。", "rec_steps": [{"title": "遅れを数えない", "body": "「何日分遅れた」と数えると、やる気が落ちます。今日から、今日の分だけを見ます。"}, {"title": "今日は最小メニューだけ", "body": "単語10個、例題1問。ゼロの日を作らず、まず戻ります。"}, {"title": "予備日で取り返す", "body": "週に1日の予備日で、遅れた分だけを取り戻します。全部を取り戻さなくてOK。"}], "rec_review_title": "週のふりかえり(日曜の夜に5分)", "rec_review": ["今週、できたことは?(1つでOK)", "できなかったことは?(理由も一言)", "来週、いちばん最初にやることは?", "外していいものは?", "誰かに聞きたいことは?"], "parent_title": "特典7 保護者の方へ:見守りガイド", "parent_lead": "お子さんの勉強を、「見守る」ための3つのポイントです。(お子さんと一緒に読んでもOKです)", "parent": [{"title": "声かけは「結果」より「やったこと」に", "body": "「何点だった?」より、「今日は何をやった?」。やったことを認める声かけの方が、続きます。"}, {"title": "計画を一緒に見るときに聞くこと", "body": "「いま、何がいちばん不安?」「いつまでに、どこまで?」「手伝えることは?」の3つ。答えを出さなくても、聞くだけで十分です。"}, {"title": "1人で抱えさせない", "body": "計画が崩れたとき、親子だけで解決しようとすると、ぶつかりがちです。第三者(計画のプロ)に見てもらうと、冷静に直せます。"}], "plus_title": "さらに:毎週3名限定 無料面談(勉強計画作成面談)", "plus_body": "結果を送ってくれた方のうち、毎週3名に、リケ先輩との無料面談をご案内します。あなた専用の勉強計画を、いっしょに作ります。すぐ下の「無料面談でできること」から、希望を送ってください。", "end_title": "ここから先は、あなた専用の計画を、一緒に", "end_body": "7大特典は、一般的な目安から、あなたの条件に合わせて作りました。あなた専用の完成版(学習設計シート)は、無料面談でつくります。", "nn_defer_none_g12": "いまは、外すものはありません。時間が足りない日は、最小メニューだけで十分です。", "bridges": ["何を外すかは、志望校の過去問や配点、あなたの得意不得意で変わります。あなた専用の「やらないこと」は、面談で一緒に決めます。", "実際の本の進み具合(何章・何周目)を見ると、やり方はもっと具体的になります。面談で、いまの本を見ながら決めます。", "模試や学校の予定を入れた「実際の日付」の計画は、面談でつくります。(診断では、一般的な目安で並べています)", "あなたが「続かなかった理由」に合わせたやり方は、面談で一緒に考えます。", "部活の曜日や通学時間を入れた、あなただけの時間割は、面談でつくります。", "崩れた原因を一緒に見て、計画を直すのは、面談でできます。", "不安や疑問は、面談で相談できます。聞くだけでもOKです。"]}, "howto": {"vocab": ["{rb}は、1周約{hours}時間。1日{perDay}分なら、約{days}日で1周です。① 1周目は意味が出るかの確認だけ。出なかったものに×② 2周目は×だけ。③ 3周が目標。朝・昼・夜に10分ずつ分けると、定着します。"], "grammar": ["{rb}は、1周約{hours}時間。1日{perDay}分で約{days}日。① 解く前に「何の文法か」を一言で言う② 間違えた問題に×③ 2周目は×だけ。理由を言えるまで、次へ進まない。"], "math_basic": ["{rb}は、1周約{hours}時間。1日{perDay}分で約{days}日。① 解く前に、解き方の方針を口に出す② 5分考えて分からなければ、解説を見る③ ×の問題だけを、翌日・3日後・1週間後にやり直す。"], "math_std": ["{rb}は、1周約{hours}時間。1日{perDay}分で約{days}日。① 1問ごとに、基本の解法のどれを使うかを言う② ×だけを2周目に③ 解けなかった理由を「知識・計算・方針」に分ける。"], "weak": ["{rb}は、苦手な単元だけを薄い本で潰します。1周約{hours}時間、1日{perDay}分で約{days}日。読んだらすぐ、基礎問題集の同じ単元で確認します。"], "calc": ["{rb}は、1日10分でも毎日。1周約{hours}時間。計算は、量より「毎日」です。"], "kaishaku": ["{rb}は、1周約{hours}時間。1日{perDay}分で約{days}日。① 1文ずつ、主語・動詞・修飾を分けて書く② 日本語に訳す③ 解説と見比べて、違う所に印。毎日2〜3文でOKです。"], "reading": ["{rb}は、1周約{hours}時間。1日{perDay}分で約{days}日。① 時間を測って1題解く② 答え合わせのあと、分からなかった文を構造で確認③ 最後に音読。読む速さが上がります。"], "listening": ["{rb}は、1周約{hours}時間。1日{perDay}分で約{days}日。毎日少しずつ。① 1回聞いて解く② スクリプトを見て確認③ もう一度聞いて、音とのズレを直す。"], "writing": ["{rb}は、1周約{hours}時間。1日{perDay}分で約{days}日。難しい表現より、間違いのない文を正しい構成で。書いたものを、解答例と見比べて、減点されそうな所を直します。"], "gendai": ["{rb}は、1周約{hours}時間。1日{perDay}分で約{days}日。① 設問の答えの根拠に、本文で線を引く② 選ばなかった選択肢が、なぜ違うかを言う③ 時間を測って1題。"], "kobun": ["{rb}は、1周約{hours}時間。1日{perDay}分で約{days}日。古文は、単語→文法→読解の順。通学中や休み時間に、5個ずつ・1ページずつ進めるのが続きます。"], "kanbun": ["{rb}は、1周約{hours}時間。1日{perDay}分で約{days}日。句法は、読み下しを声に出して覚えます。覚えたら、すぐ短い文で確認。"], "lecture": ["{rb}は、1周約{hours}時間。1日{perDay}分で約{days}日。① 1章読む② 閉じて、内容を一言で言う③ 問題集で確認。読んだだけで終わらせないのがコツです。"], "ichimon": ["{rb}は、1周約{hours}時間。1日{perDay}分で約{days}日。赤シートで答えを隠して、思い出してから確認。間違えた用語に×、翌日・3日後・1週間後に見直します。"], "drill": ["{rb}は、1周約{hours}時間。1日{perDay}分で約{days}日。① 解き方をそのまま再現できるまで繰り返す② ×の問題は、図や式を自分で描き直す③ 2〜3周が目標。"], "kyotsu": ["{rb}は、1周約{hours}時間。① 本番と同じ時間・形式で解く② 間違いの理由を「知識不足」「ケアレスミス」「時間不足」に分ける③ 直すのは、分類ごとに1つずつ。"], "past": ["{role}は、時間を測って解きます。解いたあと、解説を読み、同じ問題をもう一度。出題の傾向がつかめて、やることがはっきりします。"], "gap": ["{role}は、共テの自己採点で低かった単元だけ、基礎の1冊に戻って確認します。範囲を広げすぎないこと。"], "note": ["{rb}は、講義で学んだ内容を、書き込みながら整理します。1回で完璧にしなくてOK。"], "default": ["{rb}は、1周約{hours}時間。1日{perDay}分で約{days}日。1周目は8割でOK、2周目は×だけ。"]}, "disclaimer_deep": "この深掘り版は、参考書マスターBookの「1周の学習時間」をもとにした目安です。合格を保証するものではありません。個人差があります。"}}</script>
<script>/* 最低ライン診断の計算エンジン(画面に依存しない部品)。
 * ブラウザでは window.Engine、Node.js(テスト)では module.exports から使う。
 * データ(data)は build_tool.py が baseline_table のCSVから作る。 */
(function (root) {
  'use strict';

  var WD = ['日', '月', '火', '水', '木', '金', '土'];
  var CHUNK = 60; // 1つの本に1日あたり最初に割り当てる分数(複数の本を並行して進めるため)
  var ALLOW_EMPTY = { bookPhrase: 1 };

  function dateOnly(d) { return new Date(d.getFullYear(), d.getMonth(), d.getDate()); }
  function parseDate(s) { var p = s.split('-').map(Number); return new Date(p[0], p[1] - 1, p[2]); }
  function dayDiff(a, b) {
    return Math.round((Date.UTC(b.getFullYear(), b.getMonth(), b.getDate()) - Date.UTC(a.getFullYear(), a.getMonth(), a.getDate())) / 86400000);
  }
  function addDays(d, n) { return new Date(d.getFullYear(), d.getMonth(), d.getDate() + n); }
  function md(d) { return (d.getMonth() + 1) + '/' + d.getDate(); }
  function mdw(d) { return md(d) + '(' + WD[d.getDay()] + ')'; }
  function isWeekend(d) { return d.getDay() === 0 || d.getDay() === 6; }
  function round5(m) { return Math.max(5, Math.round(m / 5) * 5); }
  function hash(s) { var h = 2166136261; for (var i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return h >>> 0; }
  function fill(t, vars) {
    return t.replace(/\{(\w+)\}/g, function (m, k) {
      if (vars[k] === undefined || vars[k] === null) throw new Error('文面の変数「' + k + '」がありません: ' + t);
      if (vars[k] === '' && !ALLOW_EMPTY[k]) throw new Error('文面の変数「' + k + '」が空です: ' + t);
      return String(vars[k]);
    });
  }
  function pick(texts, key, seed, vars) {
    var arr = texts[key]; if (!arr || !arr.length) throw new Error('文面「' + key + '」がありません');
    return fill(arr[hash(seed + '|' + key) % arr.length], vars || {});
  }

  /* ---- 時期の判定 ---- */
  function modeFor(grade, today, P) {
    var t = dateOnly(today);
    if (t > parseDate(P.validUntil)) return 'closed';
    if (grade === '高3') {
      if (t <= parseDate(P.kyotsu)) return 'kyotsu';
      if (t <= parseDate(P.niji)) return 'niji';
      return 'closed';
    }
    return 'g12';
  }
  function tierNum(univ, medical) {
    var t = Number(univ.tier);
    if (medical && univ.kokko === 'Y') t = Math.min(5, t + 1);
    return t;

  if (a === 'subj' || a === 'inclR' || a === 'done' || a === 'g12prog' || a === 'book') return; // change で処理
  if (a === 'grade') { S.grade = v; S.group = null; S.uni = null; S.medical = false; S.track = null; setGradeDefaults(); S.step = 2; }
  else if (a === 'group') { S.group = v; S.uni = null; S.medical = false; if (v === 'まだ決まっていない') S.uni = '(まだ決まっていない)'; }
  else if (a === 'next2') { if (!S.uni) { alert('志望の大学を選んでください(決まっていなければ「まだ決まっていない」を選べます)。'); return; } S.step = 3; }
  else if (a === 'track') { S.track = v; S.subjects = presetSubjects(); }
  else if (a === 'next3') { if (!S.subjects.length) { alert('科目を1つ以上選んでください。'); return; } S.step = 4; }
  else if (a === 'wd') { S.wd = Number(v); }
  else if (a === 'we') { S.we = Number(v); }
  else if (a === 'next4') { S.step = 5; }
  else if (a === 'prog') { S.progress[el.getAttribute('data-k')] = Number(v); var sc = window.scrollY, op = []; document.querySelectorAll('details').forEach(function(d,i){ if (d.open) op.push(i); }); view(); document.querySelectorAll('details').forEach(function(d,i){ if (op.indexOf(i) >= 0) d.open = true; }); window.scrollTo(0, sc); return; }
  else if (a === 'result') { S.step = 6; }
  else if (a === 'back') { S.step = Math.max(1, S.step - 1); }
  else if (a === 'back3') { S.step = 3; }
  else if (a === 'restore') { var p = load(); if (p) { S = Object.assign(fresh(), p.S); S.step = 6; } }
  else if (a === 'reset') { S = fresh(); }
  else if (a === 'print') { window.print(); return; }
  else if (a === 'copysend') { copySend(); return; }
  else if (a === 'copymeet') { copySend((window.__RESULT || {}).lineTextMeeting); return; }
  else if (a === 'gomeet') { ev.preventDefault(); var mm = document.getElementById('meet'); if (mm) mm.scrollIntoView({behavior:'smooth', block:'start'}); return; }
  else if (a === 'gosend') { $('send').scrollIntoView({behavior:'smooth', block:'start'}); return; }
  view();
});
document.addEventListener('change', function(ev){
  var el = ev.target, a = el.getAttribute && el.getAttribute('data-a');
  if (el.id === 'uni') { S.uni = el.value || null; S.medical = false; view(); return; }
  if (el.id === 'med') { S.medical = el.checked; return; }
  if (el.id === 'club') { S.club = el.checked; return; }
  if (a === 'subj') { var s = el.getAttribute('data-v'), i = S.subjects.indexOf(s); if (el.checked && i < 0) S.subjects.push(s); if (!el.checked && i >= 0) S.subjects.splice(i, 1); }
  else if (a === 'inclR') { S.includeR = el.checked; var op = []; view(); }
  else if (a === 'done') { setChk(el.getAttribute('data-k'), el.checked); }
  else if (a === 'book') { var k = el.getAttribute('data-k'); if (el.value === 'rec') delete S.books[k]; else S.books[k] = Number(el.value); }
  else if (a === 'g12prog') { var sub = el.getAttribute('data-s'), n = Number(el.value), st = E.g12Steps(DATA, S.grade, tierLabelNow(), sub); st.forEach(function(x, i){ S.progress[E.stepKey(x)] = i < n ? 1 : 0; }); }
});
function copySend(txt){
  var t = $('linetext'), m = $('copymsg') || document.createElement('p'); if (txt) { t.value = txt; }
  function ok(){ m.textContent = 'コピーしました。LINEのトーク画面にもどって、貼りつけて送ってください。'; }
  function fallback(){ t.focus(); t.select(); m.textContent = '上の文をコピーして、LINEのトーク画面に貼りつけて送ってください。'; }
  try { navigator.clipboard.writeText(t.value).then(ok, fallback); } catch(e){ fallback(); }
}

/* ---------- 深掘り版(7大特典) ---------- */
function bridge(dp, i){ return '<p style="margin:12px 0 0;padding:10px 12px;background:var(--accbg);border-radius:8px;font-size:14px"><b style="color:var(--acc)">ここから先は、面談で。</b> '+esc(dp.bridges[i])+' <a href="#meet" data-a="gomeet" style="color:var(--acc);font-weight:800">面談でできること →</a></p>'; }
function steps(s){ return esc(s).replace(/([①②③④⑤])/g, '<br>$1'); }
function renderDeep(dp, code){
  var oa = DATA.config.lineOaId, okOa = /^@[A-Za-z0-9._-]+$/.test(oa || '');
  var meetText = '【無料面談を希望します】\n診断コード:' + code;
  var meetUrl = okOa ? 'https://line.me/R/oaMessage/' + oa + '/?' + encodeURIComponent(meetText) : '';
  var h = '<div class="hero"><span class="badge">結果を送ってくれた方へ</span><h1>'+esc(dp.title)+'</h1><p>'+esc(dp.intro)+'</p></div>';
  if (dp.empty) return h + '<div class="card"><p>'+esc(dp.R.body || 'この入力では、深掘り版を作れませんでした。診断をやり直してください。')+'</p></div>';
  h += '<div class="card" style="border-left:6px solid var(--acc)"><p style="margin:0">'+esc(dp.planFirst)+'</p></div>';
  var nav = [['t1','やらなくていいこと'],['t2','勉強法ガイド'],['t3','月ごとのチェック'],['t4','31のコツ'],['t5','タイムテーブル'],['t6','立て直し'],['t7','保護者の方へ']];
  h += '<div class="card"><h2>7大特典</h2><div class="row">' + nav.map(function(n,i){ return '<a class="btn" style="flex:1 1 45%;margin:4px 0;font-size:14px" href="#'+n[0]+'">'+(i+1)+'. '+esc(n[1])+'</a>'; }).join('') + '</div></div>';
  // 特典1
  var nn = dp.nn;
  h += '<div class="card" id="t1"><h2>特典1 '+esc(dp.nnTitle.replace(/^特典1 /,''))+'</h2><p>'+esc(nn.lead)+'</p>';
  if (nn.defer.length) { h += '<h3>'+esc(nn.deferTitle)+'</h3><ol style="padding-left:22px;margin:0 0 10px">' + nn.defer.map(function(d){ return '<li><b>'+esc(d.subject)+':'+esc(d.role)+'</b><br><span class="sub small">'+esc(d.reason)+'</span></li>'; }).join('') + '</ol>' + (nn.deferMore ? '<p class="small sub">ほか'+nn.deferMore+'件は、無料面談で一緒に決めます。</p>' : ''); }
  else h += '<p class="note-ok">'+esc(nn.deferNone)+'</p>';
  function lst(o){ return o.items.length ? '<h3>'+esc(o.title)+'</h3><ul style="margin:0 0 10px;padding-left:20px">' + o.items.map(function(x){ return '<li>'+(x.subject?esc(x.subject)+':':'')+esc(x.role||'')+(x.body?'<br><span class="sub small">'+esc(x.body)+'</span>':'')+'</li>'; }).join('') + '</ul>' : ''; }
  h += lst(nn.rec) + lst(nn.high) + lst(nn.second) + '<h3>いつでも使える「やらないこと」4つ</h3><ul style="margin:0;padding-left:20px">' + nn.rules.map(function(r){ return '<li>'+esc(r)+'</li>'; }).join('') + '</ul>' + bridge(dp,0) + '</div>';
  // 特典2
  h += '<div class="card" id="t2"><h2>'+esc(dp.howtoTitle)+'</h2><p>'+esc(dp.allDone ? dp.allDoneText : dp.howtoLead)+'</p>' + dp.howto.map(function(x){ return '<div class="tip"><b><span class="chip">'+esc(x.subject)+'</span>'+esc(x.role)+'</b>'+steps(x.text)+'</div>'; }).join('') + bridge(dp,1) + '</div>';
  // 特典3
  h += '<div class="card" id="t3"><h2>'+esc(dp.monthTitle)+'</h2><p>'+esc(dp.allDone ? dp.allDoneText : dp.monthLead)+'</p>' + dp.months.map(function(m,mi){ return '<h3>'+esc(m.label)+'</h3>' + m.items.map(function(it,j){ var k = 'sl-deep-'+code.slice(0,10)+'-'+mi+'-'+j; return '<label class="task"><input type="checkbox" data-a="done" data-k="'+esc(k)+'"'+(getChk(k)?' checked':'')+'><span>'+esc(it.subject)+':'+esc(it.role)+' 約'+it.hours+'時間'+(it.finish?'<b style="color:var(--ok)"> → この月に終える</b>':'(続ける)')+'</span></label>'; }).join(''); }).join('') + bridge(dp,2) + '</div>';
  // 特典4
  h += '<div class="card" id="t4"><h2>'+esc(dp.tipsTitle)+'</h2><p>'+esc(dp.tipsLead)+'</p>' + dp.tips.map(function(t){ return '<div class="tip"><b>'+(t.top?'<span class="chip" style="background:var(--accbg);color:var(--acc)">あなたに特におすすめ</span>':'')+esc(t.title)+'</b>'+esc(t.body)+'</div>'; }).join('') + bridge(dp,3) + '</div>';
  // 特典5
  h += '<div class="card" id="t5"><h2>'+esc(dp.timeTitle)+'</h2><p>'+esc(dp.timeLead)+'</p>' + dp.time.map(function(d){ return '<h3>'+esc(d.label)+'</h3><ol style="margin:0 0 10px;padding-left:22px">' + d.blocks.map(function(b,i){ return '<li>'+b.minutes+'分 '+esc(b.text)+(i < d.blocks.length-1 && b.minutes>=25 ? '<span class="sub small"> → 5分休憩</span>' : '')+'</li>'; }).join('') + '</ol>'; }).join('') + bridge(dp,4) + '</div>';
  // 特典6
  h += '<div class="card" id="t6"><h2>'+esc(dp.recTitle)+'</h2><p>'+esc(dp.recLead)+'</p>' + dp.recSteps.map(function(s,i){ return '<div class="ben"><div class="ck" style="background:var(--navy)">'+(i+1)+'</div><div><b>'+esc(s.title)+'</b><span>'+esc(s.body)+'</span></div></div>'; }).join('') +
    '<h3>'+esc(dp.recReviewTitle)+'</h3><ul style="margin:0;padding-left:20px">' + dp.recReview.map(function(r){ return '<li>'+esc(r)+'</li>'; }).join('') + '</ul>' + bridge(dp,5) + '</div>';
  // 特典7
  h += '<div class="card" id="t7"><h2>'+esc(dp.parentTitle)+'</h2><p>'+esc(dp.parentLead)+'</p>' + dp.parent.map(function(p,i){ return '<div class="ben"><div class="ck" style="background:var(--navy)">'+(i+1)+'</div><div><b>'+esc(p.title)+'</b><span>'+esc(p.body)+'</span></div></div>'; }).join('') + bridge(dp,6) + '</div>';
  h += '<div class="sendbox"><h2>'+esc(dp.plus.title)+'</h2><p style="margin:0">'+esc(dp.plus.body)+'</p></div>';
  // 最後: 計画はプロと / 面談でできること
  var ed = dp.edu, mt = dp.meeting;
  h += '<div class="card" style="border-left:6px solid var(--navy)"><h2>'+esc(dp.end.title)+'</h2><p>'+esc(dp.end.body)+'</p><h3>'+esc(ed.title)+'</h3><p>'+esc(ed.lead)+'</p>' +
    ed.reasons.map(function(r,i){ return '<div class="ben"><div class="ck" style="background:var(--navy)">'+(i+1)+'</div><div><b>'+esc(r.title)+'</b><span>'+esc(r.body)+'</span></div></div>'; }).join('') +
    '<p class="hl" style="margin-top:8px">'+esc(ed.pro_title)+'</p><ul style="margin:0 0 6px;padding-left:20px;font-weight:700">' + ed.pro_points.map(function(p){ return '<li>'+esc(p)+'</li>'; }).join('') + '</ul></div>';
  h += '<div class="card" style="border:2px solid var(--navy)" id="meet"><h2>'+esc(mt.title)+'</h2><p>'+esc(mt.lead)+'</p>' + mt.items.map(function(it,i){ return '<div class="ben"><div class="ck" style="background:var(--navy)">'+(i+1)+'</div><div><b>'+esc(it.title)+'</b><span>'+esc(it.body)+'</span></div></div>'; }).join('') +
    '<h3>'+esc(mt.steps_title)+'</h3><ol style="margin:0 0 10px;padding-left:22px">' + mt.steps.map(function(s){ return '<li>'+esc(s)+'</li>'; }).join('') + '</ol>' +
    (meetUrl ? '<a class="btn acc" href="'+meetUrl+'">無料面談を希望する(LINEが開きます)</a>' : '<p class="small">LINEのトークに「面談希望」と送ってください。</p>') + '<p class="small sub" style="margin:0">'+esc(mt.note)+'</p></div>';
  h += '<div class="noprint"><button class="btn" data-a="print">印刷・PDFで保存</button></div><p class="small sub">'+esc(dp.disclaimer)+'</p>';
  if (meetUrl) h += '<div class="sticky noprint"><a class="btn acc" style="margin:0 auto" href="'+meetUrl+'">無料面談を希望する</a></div>';
  return h;
}
(function start(){
  var C = qs.get('c');
  if (!C) { view(); return; }
  var inp = E.decodeCode(C, DATA);
  if (!inp) { $('app').innerHTML = '<div class="card"><h2>リンクを読み込めませんでした</h2><p>お手数ですが、診断をもう一度やり直してください。</p><a class="btn primary" href="'+location.pathname+'">診断をはじめる</a></div>'; return; }
  try { $('app').innerHTML = renderDeep(E.buildDeep(inp, DATA, TODAY), C); }
  catch(e) { $('app').innerHTML = '<div class="card"><h2>うまく表示できませんでした</h2><p>お手数ですが、診断をもう一度お試しください。</p><a class="btn primary" href="'+location.pathname+'">診断をはじめる</a></div>'; }
})();
})();
