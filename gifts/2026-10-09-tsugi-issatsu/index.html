<!doctype html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>次の1冊、どれ? | 参考書診断</title>
<style>
  :root{
    --navy:#1B3A6B;
    --navy-dark:#102244;
    --accent:#C9641A;
    --ink:#26324A;
    --sub:#5B6472;
    --line:#E3E6EB;
    --bg:#F6F7F9;
    --card:#FFFFFF;
    --chip-bg:#EEF2F7;
    color-scheme: light;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;
    font-size:15px;
    line-height:1.8;
    padding-top:env(safe-area-inset-top,0px);
    padding-bottom:calc(env(safe-area-inset-bottom,0px) + 28px);
    -webkit-text-size-adjust:100%;
  }
  [hidden]{display:none!important;}
  .wrap{max-width:480px;margin:0 auto;padding:22px 18px 0;}

  header.hero{text-align:center;margin-bottom:22px;}
  .eyebrow{display:inline-block;font-size:12px;letter-spacing:.04em;color:var(--navy);background:var(--chip-bg);padding:5px 12px;border-radius:999px;font-weight:600;margin-bottom:12px;}
  h1{font-size:20px;line-height:1.5;margin:0 0 8px;color:var(--navy-dark);font-weight:700;}
  .hero p{color:var(--sub);font-size:14px;margin:0;}

  .prog{height:6px;background:var(--line);border-radius:3px;margin:0 0 20px;overflow:hidden;}
  .prog>i{display:block;height:100%;background:var(--navy);transition:width .25s;}

  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px 16px;margin:0 0 14px;}
  .q-label{font-size:13px;font-weight:700;color:var(--navy);margin:0 0 4px;}
  .q-title{font-size:17px;font-weight:700;margin:0 0 14px;color:var(--navy-dark);line-height:1.6;}
  .q-note{font-size:13px;color:var(--sub);margin:-8px 0 14px;}

  .opt{display:block;width:100%;min-height:52px;padding:12px 16px;margin:0 0 10px;border:1.5px solid var(--line);background:#fff;color:var(--ink);border-radius:12px;font:inherit;font-size:15px;font-weight:600;text-align:left;cursor:pointer;}
  .opt .d{display:block;font-size:12.5px;color:var(--sub);font-weight:400;margin-top:3px;}
  .opt:active{background:var(--chip-bg);}
  .opt.sel{border-color:var(--navy);background:var(--navy);color:#fff;}
  .opt.sel .d{color:#cfe0f5;}

  .navrow{display:flex;gap:10px;margin-top:4px;}
  .btn{display:flex;align-items:center;justify-content:center;min-height:50px;padding:12px 18px;border:1.5px solid var(--navy);background:#fff;color:var(--navy);border-radius:12px;font:inherit;font-weight:700;font-size:15px;cursor:pointer;flex:1;text-decoration:none;}
  .btn.primary{background:var(--navy);color:#fff;}
  .btn.ghost{border-color:var(--line);color:var(--sub);font-weight:600;flex:none;padding:12px 16px;}
  .btn.acc{background:var(--accent);border-color:var(--accent);color:#fff;font-size:16px;min-height:56px;}

  .startbtn{display:block;width:100%;min-height:56px;padding:14px;border:none;background:var(--navy);color:#fff;border-radius:14px;font:inherit;font-size:16px;font-weight:700;cursor:pointer;margin-top:8px;}
  .startbtn.alt{background:#fff;color:var(--navy);border:1.5px solid var(--navy);margin-top:10px;}

  .result-hero{background:var(--navy-dark);color:#fff;border-radius:16px;padding:20px 18px;margin:0 0 16px;}
  .result-hero .tag{font-size:12px;opacity:.8;margin:0 0 6px;}
  .result-hero h2{font-size:19px;margin:0 0 4px;line-height:1.5;}
  .result-hero .meta{font-size:13px;opacity:.85;margin:0;}

  .book-card{background:#fff;border:2px solid var(--navy);border-radius:14px;padding:16px;margin-bottom:14px;}
  .book-card .label{display:inline-block;font-size:11.5px;font-weight:700;color:#fff;background:var(--navy);padding:3px 10px;border-radius:999px;margin-bottom:8px;}
  .book-card h3{font-size:17px;margin:0 0 6px;color:var(--navy-dark);line-height:1.5;}
  .book-card .pub{font-size:12.5px;color:var(--sub);margin:0 0 10px;}
  .book-card .row{display:flex;gap:16px;margin-bottom:10px;flex-wrap:wrap;}
  .book-card .row div{font-size:12.5px;color:var(--sub);}
  .book-card .row b{display:block;color:var(--ink);font-size:14px;}
  .book-card p{margin:0 0 8px;font-size:14px;}
  .book-card p.who b{color:var(--navy);}

  .next-card{background:var(--chip-bg);border-radius:12px;padding:12px 14px;margin-bottom:14px;font-size:13.5px;color:var(--ink);}
  .next-card b{color:var(--navy-dark);}

  .action-card{background:#FFF7EE;border:1.5px solid #F0C48A;border-radius:14px;padding:16px;margin-bottom:14px;}
  .action-card .num{display:inline-flex;align-items:center;justify-content:center;width:26px;height:26px;border-radius:50%;background:var(--accent);color:#fff;font-weight:800;font-size:13px;margin-right:8px;flex:none;}
  .action-item{display:flex;align-items:flex-start;gap:0;margin-bottom:14px;}
  .action-item:last-child{margin-bottom:0;}
  .action-item .txt{flex:1;}
  .action-item .txt b{display:block;font-size:13px;color:var(--accent);margin-bottom:3px;}
  .action-item .txt p{margin:0;font-size:14.5px;line-height:1.7;}
  .datebar{display:flex;align-items:center;justify-content:space-between;background:#fff;border-radius:10px;padding:10px 12px;margin-top:8px;font-size:13.5px;}
  .datebar .arrow{color:var(--sub);}
  .datebar b{color:var(--navy-dark);font-size:15px;}

  .cta-card{background:var(--navy);color:#fff;border-radius:14px;padding:18px 16px;margin-bottom:16px;}
  .cta-card h4{margin:0 0 8px;font-size:15.5px;}
  .cta-card p{margin:0;font-size:13.5px;color:#d8e3f3;line-height:1.75;}

  footer{text-align:center;padding:10px 0 4px;}
  footer p{font-size:11.5px;color:#9aa4b2;margin:0;}

  .savednote{font-size:12px;color:var(--sub);text-align:center;margin:10px 0 0;}
  .restore-card{background:#fff;border:1.5px dashed var(--line);border-radius:12px;padding:14px;margin-bottom:16px;}
  .restore-card p{margin:0 0 10px;font-size:13.5px;color:var(--sub);}
  .restore-card .title{font-size:15px;font-weight:700;color:var(--navy-dark);margin:0 0 4px;}
</style>
</head>

<script>
/* ============ 参考書マスターBook 実データ(英数国理社) ============ */
const DB = {"英語":{"sub":null,"genres":{"単語":{"walk":"単語帳は「1冊目(基礎〜標準)」と「2冊目(発展)」で役割が分かれる。1冊目はターゲット1900・システム英単語・LEAP等の王道から1冊、2冊目は鉄壁・DUO・速読英単語上級編等から志望校に応じて選ぶ。","books":[{"n":"英単語ターゲット1200","p":"旺文社","a":1,"b":1,"t":"15h","d":"1ヶ月","w":"英語がよほど苦手な人・偏差値40台からのスタート層","f":"英語が苦手な人の最初の1冊。ただし、ほとんどの受験生はこのレベルから始める必要はない","u":"短期で仕上げて速やかに1400または1900へ接続する","pr":1},{"n":"システム英単語Basic","p":"駿台文庫","a":2,"b":2,"t":"20h","d":"1.5ヶ月","w":"英語が苦手な人の基礎固め用","f":"ミニマルフレーズが使いやすく、基礎単語を効率よく習得できる","u":"終了後は無印のシステム英単語へスムーズに接続できる","pr":1},{"n":"英単語ターゲット1400","p":"旺文社","a":2,"b":2,"t":"20h","d":"1.5ヶ月","w":"偏差値60以上の高校に通っていて英語が苦手な人の導入用","f":"共通テストレベルを効率よくカバーする","u":"終えたらターゲット1900等の標準単語帳へ","pr":2},{"n":"データベース3000","p":"桐原書店","a":2,"b":2,"t":"20h","d":"2ヶ月","w":"基礎〜中堅レベル。学校採用も多い","f":"基本を押さえたオーソドックスな単語帳","u":"終えたら標準単語帳へ","pr":2},{"n":"英単語ターゲット1900","p":"旺文社","a":3,"b":3,"t":"30h","d":"2ヶ月","w":"ほぼすべての受験生。大学受験の王道の1冊目","f":"圧倒的シェアを誇る定番。一語一義のシンプルな構成で進めやすい","u":"受験学年まで反復し続けるベース単語帳として運用する","pr":1},{"n":"システム英単語","p":"駿台文庫","a":3,"b":3,"t":"35h","d":"2ヶ月","w":"1冊目としても2冊目としても使える標準〜上位層","f":"ミニマルフレーズが強み。フレーズごと覚えるため英作文にもつながる","u":"","pr":2},{"n":"必携英単語LEAP","p":"数研出版","a":3,"b":3,"t":"35h","d":"2.5ヶ月","w":"標準レベルの1冊目を探している人","f":"使うための英単語を意識した構成","u":"","pr":2},{"n":"DUO 3.0","p":"アイシーピー","a":3,"b":3,"t":"40h","d":"3ヶ月","w":"2冊目の有力候補。英作文やTOEIC対策も見据える人","f":"560本の例文に単語・熟語を凝縮","u":"2冊目は鉄壁かDUOのどちらかを選ぶ方針が良い","pr":2},{"n":"鉄壁(鉄緑会東大英単語熟語)","p":"KADOKAWA","a":4,"b":4,"t":"60h","d":"半年","w":"難関大志望者。上位層の1冊目、または標準単語帳を終えた人の2冊目","f":"関連語のネットワークやイメージ図を用いて覚える構成","u":"高1の冬〜高2の間に取り組み始められるとベスト","pr":1},{"n":"速読英単語 上級編","p":"Z会","a":5,"b":5,"t":"45h","d":"3ヶ月","w":"上級者の2〜3冊目","f":"高度な文章を読む訓練になる。純粋な単語暗記目的の本ではない","u":"国公立志望者は他分野の強化を優先する判断もあり得る","pr":1},{"n":"リンガメタリカ","p":"Z会","a":5,"b":5,"t":"45h","d":"3ヶ月","w":"早慶などの難関私大、東京外国語大・国際教養大の志望者","f":"テーマ別に専門的な背景知識と語彙を同時に学べる","u":"速読英単語上級編とどちらか一方を選べば十分","pr":2}]},"熟語":{"walk":"熟語帳は標準レベルなら1冊で十分。本格的に極めるなら「解体英熟語」が第一候補。","books":[{"n":"英熟語ターゲットR","p":"旺文社","a":2,"b":2,"t":"20h","d":"1.5ヶ月"," /* ============ マッチングロジック(実データの難易度帯から選ぶ) ============ */
function pickForLevel(books, level){
  let cands = books.filter(b => b.a<=level && level<=b.b && b.pr!==3);
  if(!cands.length) cands = books.filter(b => b.a<=level && level<=b.b);
  if(cands.length){ cands.sort((x,y)=>x.pr-y.pr); return cands[0]; }
  let best=null, bestDist=Infinity;
  books.forEach(b=>{
    const dist = level<b.a ? b.a-level : (level>b.b ? level-b.b : 0);
    if(dist<bestDist || (dist===bestDist && best && b.pr<best.pr)){ bestDist=dist; best=b; }
  });
  return best;
}
function nextBook(books, chosen){
  let pool = books.filter(b => b!==chosen && b.a > chosen.a);
  if(!pool.length) pool = books.filter(b => b!==chosen && b.a >= chosen.b);
  if(!pool.length) return null;
  pool.sort((x,y)=> (x.a-y.a) || (x.pr-y.pr));
  return pool[0];
}

  if(subject==="英語" || subject==="数学") return DB[subject].genres;
  return DB[subject][sub].genres;

}

/* ============ 期間パース(推奨期間の文字列→週数) ============ */
function periodToWeeks(str){
  if(!str) return 8;
  let m = str.match(/([\d.]+)\s*ヶ月/);
  if(m) return parseFloat(m[1]) * 4.345;
  m = str.match(/([\d.]+)\s*週間/);
  if(m) return parseFloat(m[1]);
  if(str.includes("半年")) return 26;
  if(str.includes("通年")) return 40;
  if(str.includes("直前期") || str.includes("秋")) return 6;
  return 8;
}
function addWeeks(date, weeks){
  const d = new Date(date.getTime());
  d.setDate(d.getDate() + Math.round(weeks*7));
  return d;
}
function fmtDate(d){
  return (d.getMonth()+1)+"月"+d.getDate()+"日";
}

let history = [];

function goTo(screen, extra){
  history.push(JSON.parse(JSON.stringify(state)));
  state.screen = screen;
  if(extra) Object.assign(state, extra);
  render();
  window.scrollTo(0,0);
}
function goBack(){
  if(!history.length) return;
  state = history.pop();
  render();
  window.scrollTo(0,0);
}

function stepsTotal(){
  const needsSub = getSubChoices(state.subject);
  return needsSub ? 5 : 4; // subject(+sub) + genre + level + worry
}
function stepsDone(){
  let n=0;
  if(state.subject) n++;
  if(getSubChoices(state.subject) && state.sub) n++;
  if(state.genre) n++;
  if(state.level) n++;
  if(state.worry) n++;
  return n;
}

/* ============ 保存・復元 ============ */
function saveResult(payload){
  try{ localStorage.setItem("tsugi_result", JSON.stringify(payload)); }catch(e){}
}
function loadSaved(){
  try{ const s = localStorage.getItem("tsugi_result"); return s ? JSON.parse(s) : null; }catch(e){ return null; }
}

/* ============ レンダリング ============ */
function el(html){ const d=document.createElement("div"); d.innerHTML=html; return d; }
function escapeHtml(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }

function render(){
  const app = document.getElementById("app");
  app.innerHTML = "";
  if(state.screen==="intro") app.appendChild(renderIntro());
  else if(state.screen==="subject") app.appendChild(renderSubject());
  else if(state.screen==="sub") app.appendChild(renderSub());
  else if(state.screen==="genre") app.appendChild(renderGenre());
  else if(state.screen==="level") app.appendChild(renderLevel());
  else if(state.screen==="worry") app.appendChild(renderWorry());
  else if(state.screen==="result") app.appendChild(renderResult());
  const f = document.createElement("footer");
  f.innerHTML = "<p>STUDYLIKE塾 | 出典:参考書マスターBook</p>";
  app.appendChild(f);
}

function renderIntro(){
  const wrap = el(`
    <header class="hero">
      <span class="eyebrow">90秒診断</span>
      <h1>次の1冊、どれ?<br>参考書診断</h1>
      <p>英語・国語・数学・理科・社会、全部対応。今のレベルと悩みから、次に進む1冊だけを教えます。</p>
    </header>
  `);
  const saved = loadSaved();
  if(saved){
    const rc = el(`
      <div class="restore-card">
        <p class="title">📌 前回の診断結果</p>
        <p>${escapeHtml(saved.subjectLabel)}・${escapeHtml(saved.bookName)}(${escapeHtml(saved.savedAt)})</p>
        <button class="startbtn alt" id="btnRestore">前回の結果をもう一度見る</button>
      </div>
    `);
    rc.querySelector("#btnRestore").onclick = ()=>{
      history.push(JSON.parse(JSON.stringify(state)));
      state = Object.assign({screen:"result"}, saved.state);
      render();
    };
    wrap.appendChild(rc);
  }
  const startBtn = el(`<button class="startbtn">診断をはじめる</button>`);
  startBtn.querySelector("button")?.remove && null;
  const btn = document.createElement("button");
  btn.className = "startbtn";
  btn.textContent = "診断をはじめる";
  btn.onclick = ()=> goTo("subject");
  wrap.appendChild(btn);
  return wrap;
}

function progressBar(){
  const pct = Math.round((stepsDone()/stepsTotal())*100);
  return `<div class="prog"><i style="width:${pct}%"></i></div>`;
}

function renderSubject(){
  const wrap = el(`
    <header class="hero"><h1>次の1冊、どれ?診断</h1></header>
    ${progressBar()}
    <div class="card">
      <p class="q-label">Q1</p>
      <p class="q-title">今日チェックしたい科目を1つ選んでね</p>
      <div id="opts"></div>
    </div>
  `);
  const opts = wrap.querySelector("#opts");
  SUBJECTS.forEach(s=>{
    const b = document.createElement("button");
    b.className = "opt";
    b.innerHTML = `${escapeHtml(s.k)}<span class="d">${escapeHtml(s.d)}</span>`;
    b.onclick = ()=>{
      const needsSub = getSubChoices(s.k);
      if(needsSub) goTo("sub", {subject:s.k, sub:null, genre:null, level:null, worry:null});
      else goTo("genre", {subject:s.k, sub:null, genre:null, level:null, worry:null});
    };
    opts.appendChild(b);
  });
  addNav(wrap, true);
  return wrap;
}

function renderSub(){
  const choices = getSubChoices(state.subject);
  const wrap = el(`
    <header class="hero"><h1>次の1冊、どれ?診断</h1></header>
    ${progressBar()}
    <div class="card">
      <p class="q-label">Q2・${escapeHtml(state.subject)}</p>
      <p class="q-title">${escapeHtml(SUBCHOICE_LABEL[state.subject] || "どれ?")}</p>
      <div id="opts"></div>
    </div>
  `);
  const opts = wrap.querySelector("#opts");
  choices.forEach(c=>{
    const b = document.createElement("button");
    b.className = "opt";
    b.textContent = c;
    b.onclick = ()=> goTo("genre", {sub:c});
    opts.appendChild(b);
  });
  addNav(wrap, true);
  return wrap;
}

function renderGenre(){
  const genres = getGenres(state.subject, state.sub);
  const names = Object.keys(genres);
  const label = state.sub ? `${state.subject}・${state.sub}` : state.subject;
  const wrap = el(`
    <header class="hero"><h1>次の1冊、どれ?診断</h1></header>
    ${progressBar()}
    <div class="card">
      <p class="q-label">Q3・${escapeHtml(label)}</p>
      <p class="q-title">今、一番気になっているジャンルは?</p>
      <div id="opts"></div>
    </div>
  `);
  const opts = wrap.querySelector("#opts");
  names.forEach(gName=>{
    const b = document.createElement("button");
    b.className = "opt";
    const walk = genres[gName].walk || "";
    b.innerHTML = `${escapeHtml(gName)}<span class="d">${escapeHtml(walk.slice(0,38))}${walk.length>38?"…":""}</span>`;
    b.onclick = ()=> goTo("level", {genre:gName});
    opts.appendChild(b);
  });
  addNav(wrap, true);
  return wrap;
}

function renderLevel(){
  const wrap = el(`
    <header class="hero"><h1>次の1冊、どれ?診断</h1></header>
    ${progressBar()}
    <div class="card">
      <p class="q-label">Q4・${escapeHtml(state.genre)}</p>
      <p class="q-title">今の実力感に一番近いものは?</p>
      <p class="q-note">偏差値や模試の判定で迷ったら、⑥でOK。</p>
      <div id="opts"></div>
    </div>
  `);
  const opts = wrap.querySelector("#opts");
  LEVELS.forEach((lv,idx)=>{
    const b = document.createElement("button");
    b.className = "opt";
    b.innerHTML = `${escapeHtml(lv.t)}<span class="d">${escapeHtml(lv.d)}</span>`;
    b.onclick = ()=> goTo("worry", {level:lv.v, unknownLevel: !!lv.unknown});
    opts.appendChild(b);
  });
  addNav(wrap, true);
  return wrap;
}

function renderWorry(){
  const wrap = el(`
    <header class="hero"><h1>次の1冊、どれ?診断</h1></header>
    ${progressBar()}
    <div class="card">
      <p class="q-label">Q5・最後の質問</p>
      <p class="q-title">今、一番困っていることは?</p>
      <div id="opts"></div>
    </div>
  `);
  const opts = wrap.querySelector("#opts");
  WORRIES.forEach(w=>{
    const b = document.createElement("button");
    b.className = "opt";
    b.textContent = w.t;
    b.onclick = ()=> goTo("result", {worry:w.k});
    opts.appendChild(b);
  });
  addNav(wrap, true);
  return wrap;
}

function actionText(worryKey, bookName){
  const map = {
    next: `今夜中に、書店サイトか本屋さんで「${bookName}」の目次だけ確認する。買うのは今夜じゃなくてOK。次に何をやるかを決め切るのが今夜のゴール。`,
    start: `今日の授業ノートか教科書を1ページだけ見返して、わからなかった所に印をつける。印をつけた所から「${bookName}」を開く。`,
    school: `学校の教材の目次を1分だけ見て、「${bookName}」がカバーする範囲とどれくらい重なっているか確認する。`,
    none: `「${bookName}」を本屋かネットで検索して、最初の1ページ(または最初の1単元)だけ今夜中に目を通す。`
  };
  return map[worryKey] || map.none;
}

function renderResult(){
  const genres = getGenres(state.subject, state.sub);
  const genreObj = genres[state.genre];
  const books = genreObj.books;
  const chosen = pickForLevel(books, state.level);
  const nb = nextBook(books, chosen);
  const weeks = periodToWeeks(chosen.d);
  const today = new Date();
  const goal = addWeeks(today, weeks);
  const subjectLabel = state.sub ? `${state.subject}・${state.sub}・${state.genre}` : `${state.subject}・${state.genre}`;

  const wrap = el(`
    <div class="result-hero">
      <p class="tag">${escapeHtml(subjectLabel)}の診断結果</p>
      <h2>次に進む1冊が決まりました</h2>
      <p class="meta">${escapeHtml(genreObj.walk ? genreObj.walk.slice(0,50)+"…" : "")}</p>
    </div>

    <div class="book-card">
      <span class="label">今、やるべき1冊</span>
      <h3>${escapeHtml(chosen.n)}</h3>
      <p class="pub">${escapeHtml(chosen.p)}</p>
      <div class="row">
        <div>学習時間(1周)<b>${escapeHtml(chosen.t)}</b></div>
        <div>推奨期間<b>${escapeHtml(chosen.d)}</b></div>
      </div>
      <p class="who"><b>こんな人に:</b> ${escapeHtml(chosen.w)}</p>
      <p><b>特徴:</b> ${escapeHtml(chosen.f)}</p>
      ${chosen.u ? `<p><b>使い方・接続:</b> ${escapeHtml(chosen.u)}</p>` : ""}
    </div>

    ${nb ? `<div class="next-card"><b>この後は:</b> 「${escapeHtml(chosen.n)}」が終わったら、次は「${escapeHtml(nb.n)}」(${escapeHtml(nb.p)})へ接続するのがおすすめです。</div>`
         : `<div class="next-card"><b>この後は:</b> このジャンルはここが仕上げの位置づけです。志望校の過去問(赤本・青本)に進みましょう。</div>`}

    <div class="action-card">
      <div class="action-item">
        <span class="num">①</span>
        <div class="txt"><b>今夜やる1つのこと</b><p>${escapeHtml(actionText(state.worry, chosen.n))}</p></div>
      </div>
      <div class="action-item">
        <span class="num">②</span>
        <div class="txt">
          <b>期間内の予定(日付つき)</b>
          <p>今日から「${escapeHtml(chosen.d)}」を目安に、1周を目指しましょう。</p>
          <div class="datebar">
            <span>今日 ${escapeHtml(fmtDate(today))}</span>
            <span class="arrow">→</span>
            <span>目標 <b>${escapeHtml(fmtDate(goal))}</b>までに1周</span>
          </div>
        </div>
      </div>
      <div class="action-item">
        <span class="num">③</span>
        <div class="txt"><b>保存・見返し</b><p>この結果はこの端末に保存されます。LINEトークを探さなくても、このページをもう一度開けば「前回の診断結果」からすぐ見返せます。</p></div>
      </div>
    </div>

    <div class="cta-card">
      <h4>一歩先の提案</h4>
      <p>この1冊が終わる頃には、次の壁(過去問・志望校対策)が見えてきます。今の学年・志望校・今日選んだ科目を教えてもらえたら、年間の参考書ルートを面談で一緒に組み立てます。LINEでそのまま返信してね。</p>
    </div>

    <div class="navrow" style="margin-top:4px;">
      <button class="btn" id="btnAgain">別の科目も診断する</button>
    </div>
  `);

  saveResult({
    subjectLabel,
    bookName: chosen.n,
    savedAt: `${today.getMonth()+1}/${today.getDate()}`,
    state: JSON.parse(JSON.stringify(state))
  });

  wrap.querySelector("#btnAgain").onclick = ()=>{
    state = { screen:"subject", subject:null, sub:null, genre:null, level:null, unknownLevel:false, worry:null };
    history = [];
    render();
    window.scrollTo(0,0);
  };
  return wrap;
}

function addNav(wrap, showBack){
  const row = document.createElement("div");
  row.className = "navrow";
  if(showBack && history.length){
    const back = document.createElement("button");
    back.className = "btn ghost";
    back.textContent = "戻る";
    back.onclick = goBack;
    row.appendChild(back);
  }
  wrap.appendChild(row);
}

render();
</script>
</body>
</html>
